# Neo4j Operator Helm values (OP-2-001-PKG-02).
# Install CRDs first (server-side apply) — see chart README / make helm-install.

image:
  repository: neo4joperatoracr.azurecr.io/neo4j-operator
  # Empty → Chart.appVersion (immutable semver). Avoid latest in production.
  tag: ""
  # Optional sha256:... — when set, rendered as repository@digest (ignores tag).
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Namespaces the operator reconciles (WATCH_NAMESPACE). One Role+RoleBinding each.
# Must not include the Helm release namespace (NEO-016) — install the operator in
# neo4j-operator-system (or similar) and list workload namespaces here.
watchNamespaces:
  - default

replicaCount: 1

# Operand Neo4j image repositories allowed in CRs (NEO-012).
# Default: official neo4j short name + docker.io. Add your ACR/ECR mirror, e.g.:
#   - myacr.azurecr.io/neo4j
# Use ["*"] only in disposable labs.
allowedImageRepositories:
  - neo4j
  - docker.io/neo4j
  - index.docker.io/neo4j

# Concurrent Neo4j reconciles (NEO-014). Default 2 so one wedged CR cannot starve others.
# Maximum 16 — higher values are rejected at operator start (API-server stampede).
maxConcurrentReconciles: 2

# Extra args appended after --leader-elect / health probe / logging args.
extraArgs: []

# Operator logging (ADR-014). stderr = essentials; optional file may be more verbose.
logging:
  # --zap-log-level: debug | info | error
  level: info
  # --zap-devel: console encoder + debug defaults
  devel: false
  file:
    enabled: false
    level: debug
    mountPath: /var/log/neo4j-operator
    filename: operator.log

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}

tolerations: []
# Example (AKS dedicated pool):
# tolerations:
#   - key: dedicated
#     operator: Equal
#     value: neo4j
#     effect: NoSchedule

affinity: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

serviceAccount:
  create: true
  # Defaults to neo4j-operator-controller-manager when create is true.
  # Required when create is false (chart fails render if unset — do not bind to "default").
  name: ""
  annotations: {}

nameOverride: ""
fullnameOverride: ""

# When true, NOTES remind you to install the CRD via server-side apply.
crd:
  installHint: true

# Validating admission webhook (NEO-001). Off by default — enable with cert-manager
# (or supply webhook.caBundle + a TLS Secret named webhook.secretName).
webhook:
  enabled: false
  failurePolicy: Fail
  timeoutSeconds: 10
  secretName: neo4j-operator-webhook-certs
  # Base64 CA when certManager.enabled is false (required in that mode).
  caBundle: ""
  certManager:
    enabled: true
    # Create a namespaced self-signed Issuer named issuerRef.name (skip for ClusterIssuer).
    createIssuer: true
    issuerRef:
      name: selfsigned-issuer
      kind: Issuer
      # group: cert-manager.io
