apiVersion: v2
name: neo4j-operator
description: Neo4j Kubernetes Operator controller (CRDs, RBAC, Deployment)
type: application
version: 1.0.0
appVersion: "1.0.0"
# Oldest Kubernetes the operator supports, including OpenShift 4.21.
# The CRDs use the CEL quantity library (quantity()/isQuantity()) to block a volume shrink;
# that library is always-on from 1.29, so 1.34 satisfies it.
kubeVersion: ">= 1.34.0-0"
keywords:
  - neo4j
  - operator
  - kubernetes
home: https://github.com/neo4j-partners/neo4j-kubernetes-operator
sources:
  - https://github.com/neo4j-partners/neo4j-kubernetes-operator
maintainers:
  - name: Marouane Gazanayi
    email: marouane.gazanayi@neo4j.com
  - name: Charles Boudry
    email: charles.boudry@neo4j.com
  - name: Alfredo Rubin
    email: alfredo.rubin@neo4j.com