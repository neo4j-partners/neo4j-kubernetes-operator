apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo4j-operator-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "neo4j-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "neo4j-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "neo4j-operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "neo4j-operator.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: manager
        image: "{{ include "neo4j-operator.image" . }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
        - /manager
        args:
        - --leader-elect
        - --health-probe-bind-address=:8081
        - --zap-log-level={{ .Values.logging.level | default "info" }}
        {{- if .Values.allowedImageRepositories }}
        - --allowed-image-repositories={{ .Values.allowedImageRepositories | join "," }}
        {{- end }}
        - --max-concurrent-reconciles={{ .Values.maxConcurrentReconciles | default 2 }}
        {{- if .Values.logging.devel }}
        - --zap-devel=true
        {{- end }}
        {{- if .Values.logging.file.enabled }}
        - --log-file={{ .Values.logging.file.mountPath }}/{{ .Values.logging.file.filename }}
        - --log-file-level={{ .Values.logging.file.level | default "debug" }}
        {{- end }}
        {{- if .Values.webhook.enabled }}
        - --enable-webhooks
        - --webhook-cert-dir=/tmp/k8s-webhook-server/serving-certs
        {{- end }}
        {{- with .Values.extraArgs }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        env:
        - name: WATCH_NAMESPACE
          value: {{ include "neo4j-operator.watchNamespacesCSV" . | quote }}
        ports:
        - containerPort: 8081
          name: health
        {{- if .Values.webhook.enabled }}
        - containerPort: 9443
          name: webhook
          protocol: TCP
        {{- end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        {{- if .Values.webhook.enabled }}
        - name: webhook-certs
          mountPath: /tmp/k8s-webhook-server/serving-certs
          readOnly: true
        {{- end }}
        {{- if .Values.logging.file.enabled }}
        - name: operator-logs
          mountPath: {{ .Values.logging.file.mountPath }}
        {{- end }}
      volumes:
      - name: tmp
        emptyDir: {}
      {{- if .Values.webhook.enabled }}
      - name: webhook-certs
        secret:
          secretName: {{ .Values.webhook.secretName }}
          defaultMode: 420
      {{- end }}
      {{- if .Values.logging.file.enabled }}
      - name: operator-logs
        emptyDir: {}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
