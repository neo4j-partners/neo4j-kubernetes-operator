{{- if .Values.webhook.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: neo4j-operator-webhook-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "neo4j-operator.labels" . | nindent 4 }}
spec:
  ports:
  - port: 443
    protocol: TCP
    targetPort: 9443
  selector:
    {{- include "neo4j-operator.selectorLabels" . | nindent 4 }}
{{- end }}
