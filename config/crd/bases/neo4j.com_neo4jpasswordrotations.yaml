---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: neo4jpasswordrotations.neo4j.com
spec:
  group: neo4j.com
  names:
    kind: Neo4jPasswordRotation
    listKind: Neo4jPasswordRotationList
    plural: neo4jpasswordrotations
    shortNames:
    - n4jpr
    singular: neo4jpasswordrotation
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.neo4jRef.name
      name: Cluster
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.reason
      name: Reason
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: Neo4jPasswordRotation is an immutable, one-shot admin-password
          rotation record (BDR-017, ADR-019).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              Neo4jPasswordRotationSpec is the desired state of a one-shot, immutable admin-password
              rotation record (BDR-017 Option F, ADR-019). The rotation owner stages the new password in
              its own Secret and leaves the instance's live auth Secret (the old value) untouched; the
              operator authenticates with the still-live old value, runs ALTER USER neo4j SET PASSWORD, then
              writes the new value into the live auth Secret. The old value therefore survives until the
              ALTER lands — no persistent shadow Secret.
            properties:
              deleteNewSecretOnSuccess:
                description: |-
                  DeleteNewSecretOnSuccess opts the operator into deleting the staged Secret once the rotation
                  reports Succeeded. Default false leaves the staged Secret to its owner. The operator never
                  deletes it on a failure path — it is the sole copy of the new password until write-back lands.
                type: boolean
              neo4jRef:
                description: Neo4jRef is the target workload whose admin (neo4j) password
                  is rotated.
                properties:
                  name:
                    description: Name of the target Neo4j resource in the same namespace.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              newPasswordSecretRef:
                description: |-
                  NewPasswordSecretRef references the Secret holding the NEW credential (key NEO4J_AUTH,
                  value "neo4j/<new>"), staged by the rotation owner. It must carry the same delegation
                  labels as any operator-mounted auth Secret (NEO-005 / ADD-01). The instance's current auth
                  Secret is read as the OLD value and is not named here.
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
            required:
            - neo4jRef
            - newPasswordSecretRef
            type: object
          status:
            description: Neo4jPasswordRotationStatus is the observed state of a rotation
              run.
            properties:
              conditions:
                description: Conditions are Kubernetes-standard signals.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              message:
                description: Message is a human-readable detail; never the password
                  itself.
                type: string
              observedGeneration:
                description: ObservedGeneration is the last spec generation reconciled.
                format: int64
                type: integer
              phase:
                description: Phase is the coarse run state (Pending, Running, Succeeded,
                  Failed).
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                type: string
              reason:
                description: Reason is a stable machine reason on failure (oracle
                  catalog).
                type: string
            type: object
        type: object
        x-kubernetes-validations:
        - message: Neo4jPasswordRotation spec is immutable (it is a run-to-completion
            record); file a new rotation to rotate again
          rule: self.spec == oldSelf.spec
    served: true
    storage: true
    subresources:
      status: {}
