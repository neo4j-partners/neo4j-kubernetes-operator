---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: neo4jstudios.neo4j.com
spec:
  group: neo4j.com
  names:
    kind: Neo4jStudio
    listKind: Neo4jStudioList
    plural: neo4jstudios
    shortNames:
    - n4js
    singular: neo4jstudio
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.url
      name: URL
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: Neo4jStudio stands up Enterprise Studio and points it at one-to-many
          Neo4j deployments (BDR-015).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Neo4jStudioSpec is the desired state of an Enterprise Studio
              deployment (BDR-015).
            properties:
              assetStore:
                description: AssetStore is where Studio persists its own assets (BDR-015
                  §4).
                properties:
                  auth:
                    description: Auth references the asset-store credentials.
                    properties:
                      secretRef:
                        description: SecretRef names the Secret holding the credentials.
                        properties:
                          name:
                            description: Name of the Secret in the same namespace.
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - secretRef
                    type: object
                  database:
                    description: Database is the asset database name; it must already
                      exist (BYO — BDR-015 §4-a).
                    minLength: 1
                    type: string
                  uri:
                    description: |-
                      URI of the Neo4j instance holding the asset database (e.g. neo4j://my-graph.ns.svc:7687). Studio
                      connects to it as a Bolt driver client, so it must use a Neo4j/Bolt scheme (not http/https) —
                      independent of any served deployment's mode.
                    minLength: 1
                    pattern: ^(neo4j|neo4j\+s|neo4j\+ssc|bolt|bolt\+s|bolt\+ssc)://
                    type: string
                required:
                - auth
                - database
                - uri
                type: object
              config:
                additionalProperties:
                  type: string
                description: |-
                  Config passes through non-secret NES_* keys verbatim (BDR-015 §9), e.g. tuning or generativeAi
                  URLs/models. Secret-valued keys go through configFromSecrets, never here.
                type: object
              configFromSecrets:
                description: |-
                  ConfigFromSecrets sources secret-valued NES_* keys from Secrets (secretKeyRef env). This is the
                  secure passthrough for any NES setting carrying a secret (generativeAi API keys, OIDC client
                  secrets, …) that the operator does not model as a first-class field.
                items:
                  description: |-
                    StudioSecretConfig sources one NES_* configuration key from a Secret, injected as a secretKeyRef
                    environment variable. This is the secure passthrough for any NES setting that carries a secret
                    (e.g. generativeAi API keys, OIDC client secrets) without the operator modelling each one inline.
                  properties:
                    name:
                      description: Name is the exact NES_* environment variable name
                        (e.g. NES_generativeAi_chatCompletionProvider_default_upstream_apiKey).
                      minLength: 1
                      pattern: ^NES_
                      type: string
                    secretRef:
                      description: SecretRef selects the Secret key holding the value.
                      properties:
                        key:
                          minLength: 1
                          type: string
                        name:
                          minLength: 1
                          type: string
                      required:
                      - key
                      - name
                      type: object
                  required:
                  - name
                  - secretRef
                  type: object
                type: array
              connectivity:
                description: Connectivity is Studio's own front door (BDR-015 §8).
                properties:
                  ingress:
                    description: StudioIngressSpec configures an optional Ingress
                      in front of Studio (BDR-015 §8, reuses BDR-007).
                    properties:
                      annotations:
                        additionalProperties:
                          type: string
                        type: object
                      className:
                        type: string
                      rules:
                        items:
                          description: StudioIngressRule routes a host to Studio (single
                            backend, unlike the Neo4j multi-backend rules).
                          properties:
                            host:
                              description: Host is the external hostname routed to
                                Studio.
                              minLength: 1
                              type: string
                          required:
                          - host
                          type: object
                        type: array
                      tls:
                        items:
                          description: IngressTLSBlock holds TLS hosts and secret
                            for Ingress.
                          properties:
                            hosts:
                              items:
                                type: string
                              type: array
                            secretName:
                              type: string
                          type: object
                        type: array
                    type: object
                  service:
                    description: StudioServiceSpec configures Studio's own front-door
                      Service.
                    properties:
                      annotations:
                        additionalProperties:
                          type: string
                        type: object
                      type:
                        allOf:
                        - enum:
                          - ClusterIP
                          - LoadBalancer
                          - NodePort
                        - enum:
                          - ClusterIP
                          - LoadBalancer
                          - NodePort
                        default: ClusterIP
                        description: ServiceType for client connectivity service.
                        type: string
                    type: object
                type: object
              deployments:
                description: Deployments are the served Neo4j deployments (one-to-many;
                  at least one — BDR-015 §2).
                items:
                  description: |-
                    StudioDeployment is one Neo4j deployment that Studio serves (BDR-015 §2 — one-to-many). Exactly
                    one of neo4jRef (in-cluster, resolved by the operator) or uri (external, used verbatim).
                  properties:
                    auth:
                      description: Auth toggles the end-user sign-in methods for this
                        deployment (basic / oidc).
                      properties:
                        basic:
                          description: Basic enables username/password sign-in. Omit
                            to use the NES default (enabled).
                          type: boolean
                        oidc:
                          description: OIDC enables single sign-on. Omit to use the
                            NES default (enabled).
                          type: boolean
                      type: object
                    mode:
                      description: |-
                        Mode selects Direct (browser dials the DBMS over Bolt) or ReverseProxy (Studio proxies over the
                        DBMS HTTP connector) for this deployment.
                      enum:
                      - Direct
                      - ReverseProxy
                      type: string
                    name:
                      description: Name is the display name of this deployment in
                        Studio.
                      minLength: 1
                      type: string
                    neo4jRef:
                      description: |-
                        Neo4jRef references an in-cluster Neo4j in the same namespace; the operator resolves it to the
                        workload's client Service URI (ADR-018 — never re-derived).
                      properties:
                        name:
                          description: Name of the target Neo4j resource in the same
                            namespace.
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    publicUri:
                      description: |-
                        PublicURI optionally overrides the browser-reachable Bolt URI for Direct mode (maps to
                        directClientQuery.publicUri). For a neo4jRef the operator derives the in-cluster Bolt URI when
                        this is omitted; set it when the browser reaches the DBMS at a different, external address.
                      type: string
                    roleMapping:
                      description: RoleMapping maps Neo4j users/roles to Studio roles
                        for this deployment.
                      items:
                        description: |-
                          StudioRoleMapping grants a Studio role (studioAdmin/studioCreator) to Neo4j users/roles for a
                          deployment (maps to neo4jDeployments.<id>.authorization.roleMapping). When omitted, NES defaults to
                          studioAdmin→databaseRole:admin and studioCreator→databaseRole:PUBLIC.
                        properties:
                          members:
                            description: Members are the Neo4j users/roles granted
                              the role.
                            items:
                              description: StudioRoleMember is one Neo4j user/role
                                that a mapping grants a Studio role to.
                              properties:
                                kind:
                                  description: Kind is databaseUser or databaseRole.
                                  enum:
                                  - databaseUser
                                  - databaseRole
                                  type: string
                                name:
                                  description: Name is the Neo4j user or role name.
                                  minLength: 1
                                  type: string
                              required:
                              - kind
                              - name
                              type: object
                            minItems: 1
                            type: array
                          role:
                            description: Role is the Studio role to grant.
                            enum:
                            - studioAdmin
                            - studioCreator
                            type: string
                        required:
                        - members
                        - role
                        type: object
                      type: array
                    uri:
                      description: |-
                        URI is an external Neo4j endpoint (e.g. neo4j+s://…), used verbatim; the operator does not
                        resolve or validate its reachability at admission (BDR-015 §2).
                      type: string
                  required:
                  - mode
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: set deployments[].neo4jRef (in-cluster) or deployments[].uri
                      (external), not both
                    rule: has(self.neo4jRef) != has(self.uri)
                minItems: 1
                type: array
              image:
                description: Image optionally overrides the Studio image repository
                  / digest / pull policy.
                properties:
                  digest:
                    description: Digest pins the image by digest (repo@sha256:...).
                      When set, spec.version is not used in the ref.
                    pattern: ^sha256:[a-fA-F0-9]{64}$
                    type: string
                  pullPolicy:
                    default: IfNotPresent
                    description: PullPolicy describes a policy for if/when to pull
                      a container image
                    enum:
                    - Always
                    - IfNotPresent
                    - Never
                    type: string
                  pullSecrets:
                    items:
                      type: string
                    type: array
                  repository:
                    description: Repository is the Studio image name without tag.
                      Omit to use the operator's pinned Studio image.
                    type: string
                type: object
              license:
                description: |-
                  License is the OPTIONAL Enterprise Studio license — distinct from the Neo4j Enterprise license;
                  Studio starts without it (BDR-015 §3).
                properties:
                  secretRef:
                    description: SecretRef names the Secret holding the credentials.
                    properties:
                      name:
                        description: Name of the Secret in the same namespace.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                required:
                - secretRef
                type: object
              replicas:
                description: Replicas is the Studio Deployment replica count. Studio
                  is stateless; defaults to 1 (BDR-015 §10).
                format: int32
                minimum: 1
                type: integer
              security:
                description: Security overrides the operator's hardened pod/container
                  securityContext defaults.
                properties:
                  containerSecurityContext:
                    description: |-
                      SecurityContext holds security configuration that will be applied to a container.
                      Some fields are present in both SecurityContext and PodSecurityContext.  When both
                      are set, the values in SecurityContext take precedence.
                    properties:
                      allowPrivilegeEscalation:
                        description: |-
                          AllowPrivilegeEscalation controls whether a process can gain more
                          privileges than its parent process. This bool directly controls if
                          the no_new_privs flag will be set on the container process.
                          AllowPrivilegeEscalation is true always when the container is:
                          1) run as Privileged
                          2) has CAP_SYS_ADMIN
                          Note that this field cannot be set when spec.os.name is windows.
                        type: boolean
                      appArmorProfile:
                        description: |-
                          appArmorProfile is the AppArmor options to use by this container. If set, this profile
                          overrides the pod's appArmorProfile.
                          Note that this field cannot be set when spec.os.name is windows.
                        properties:
                          localhostProfile:
                            description: |-
                              localhostProfile indicates a profile loaded on the node that should be used.
                              The profile must be preconfigured on the node to work.
                              Must match the loaded name of the profile.
                              Must be set if and only if type is "Localhost".
                            type: string
                          type:
                            description: |-
                              type indicates which kind of AppArmor profile will be applied.
                              Valid options are:
                                Localhost - a profile pre-loaded on the node.
                                RuntimeDefault - the container runtime's default profile.
                                Unconfined - no AppArmor enforcement.
                            type: string
                        required:
                        - type
                        type: object
                      capabilities:
                        description: |-
                          The capabilities to add/drop when running containers.
                          Defaults to the default set of capabilities granted by the container runtime.
                          Note that this field cannot be set when spec.os.name is windows.
                        properties:
                          add:
                            description: Added capabilities
                            items:
                              description: Capability represent POSIX capabilities
                                type
                              type: string
                            type: array
                            x-kubernetes-list-type: atomic
                          drop:
                            description: Removed capabilities
                            items:
                              description: Capability represent POSIX capabilities
                                type
                              type: string
                            type: array
                            x-kubernetes-list-type: atomic
                        type: object
                      privileged:
                        description: |-
                          Run container in privileged mode.
                          Processes in privileged containers are essentially equivalent to root on the host.
                          Defaults to false.
                          Note that this field cannot be set when spec.os.name is windows.
                        type: boolean
                      procMount:
                        description: |-
                          procMount denotes the type of proc mount to use for the containers.
                          The default value is Default which uses the container runtime defaults for
                          readonly paths and masked paths.
                          This requires the ProcMountType feature flag to be enabled.
                          Note that this field cannot be set when spec.os.name is windows.
                        type: string
                      readOnlyRootFilesystem:
                        description: |-
                          Whether this container has a read-only root filesystem.
                          Default is false.
                          Note that this field cannot be set when spec.os.name is windows.
                        type: boolean
                      runAsGroup:
                        description: |-
                          The GID to run the entrypoint of the container process.
                          Uses runtime default if unset.
                          May also be set in PodSecurityContext.  If set in both SecurityContext and
                          PodSecurityContext, the value specified in SecurityContext takes precedence.
                          Note that this field cannot be set when spec.os.name is windows.
                        format: int64
                        type: integer
                      runAsNonRoot:
                        description: |-
                          Indicates that the container must run as a non-root user.
                          If true, the Kubelet will validate the image at runtime to ensure that it
                          does not run as UID 0 (root) and fail to start the container if it does.
                          If unset or false, no such validation will be performed.
                          May also be set in PodSecurityContext.  If set in both SecurityContext and
                          PodSecurityContext, the value specified in SecurityContext takes precedence.
                        type: boolean
                      runAsUser:
                        description: |-
                          The UID to run the entrypoint of the container process.
                          Defaults to user specified in image metadata if unspecified.
                          May also be set in PodSecurityContext.  If set in both SecurityContext and
                          PodSecurityContext, the value specified in SecurityContext takes precedence.
                          Note that this field cannot be set when spec.os.name is windows.
                        format: int64
                        type: integer
                      seLinuxOptions:
                        description: |-
                          The SELinux context to be applied to the container.
                          If unspecified, the container runtime will allocate a random SELinux context for each
                          container.  May also be set in PodSecurityContext.  If set in both SecurityContext and
                          PodSecurityContext, the value specified in SecurityContext takes precedence.
                          Note that this field cannot be set when spec.os.name is windows.
                        properties:
                          level:
                            description: Level is SELinux level label that applies
                              to the container.
                            type: string
                          role:
                            description: Role is a SELinux role label that applies
                              to the container.
                            type: string
                          type:
                            description: Type is a SELinux type label that applies
                              to the container.
                            type: string
                          user:
                            description: User is a SELinux user label that applies
                              to the container.
                            type: string
                        type: object
                      seccompProfile:
                        description: |-
                          The seccomp options to use by this container. If seccomp options are
                          provided at both the pod & container level, the container options
                          override the pod options.
                          Note that this field cannot be set when spec.os.name is windows.
                        properties:
                          localhostProfile:
                            description: |-
                              localhostProfile indicates a profile defined in a file on the node should be used.
                              The profile must be preconfigured on the node to work.
                              Must be a descending path, relative to the kubelet's configured seccomp profile location.
                              Must be set if type is "Localhost". Must NOT be set for any other type.
                            type: string
                          type:
                            description: |-
                              type indicates which kind of seccomp profile will be applied.
                              Valid options are:

                              Localhost - a profile defined in a file on the node should be used.
                              RuntimeDefault - the container runtime default profile should be used.
                              Unconfined - no profile should be applied.
                            type: string
                        required:
                        - type
                        type: object
                      windowsOptions:
                        description: |-
                          The Windows specific settings applied to all containers.
                          If unspecified, the options from the PodSecurityContext will be used.
                          If set in both SecurityContext and PodSecurityContext, the value specified in SecurityContext takes precedence.
                          Note that this field cannot be set when spec.os.name is linux.
                        properties:
                          gmsaCredentialSpec:
                            description: |-
                              GMSACredentialSpec is where the GMSA admission webhook
                              (https://github.com/kubernetes-sigs/windows-gmsa) inlines the contents of the
                              GMSA credential spec named by the GMSACredentialSpecName field.
                            type: string
                          gmsaCredentialSpecName:
                            description: GMSACredentialSpecName is the name of the
                              GMSA credential spec to use.
                            type: string
                          hostProcess:
                            description: |-
                              HostProcess determines if a container should be run as a 'Host Process' container.
                              All of a Pod's containers must have the same effective HostProcess value
                              (it is not allowed to have a mix of HostProcess containers and non-HostProcess containers).
                              In addition, if HostProcess is true then HostNetwork must also be set to true.
                            type: boolean
                          runAsUserName:
                            description: |-
                              The UserName in Windows to run the entrypoint of the container process.
                              Defaults to the user specified in image metadata if unspecified.
                              May also be set in PodSecurityContext. If set in both SecurityContext and
                              PodSecurityContext, the value specified in SecurityContext takes precedence.
                            type: string
                        type: object
                    type: object
                  podSecurityContext:
                    description: |-
                      PodSecurityContext holds pod-level security attributes and common container settings.
                      Some fields are also present in container.securityContext.  Field values of
                      container.securityContext take precedence over field values of PodSecurityContext.
                    properties:
                      appArmorProfile:
                        description: |-
                          appArmorProfile is the AppArmor options to use by the containers in this pod.
                          Note that this field cannot be set when spec.os.name is windows.
                        properties:
                          localhostProfile:
                            description: |-
                              localhostProfile indicates a profile loaded on the node that should be used.
                              The profile must be preconfigured on the node to work.
                              Must match the loaded name of the profile.
                              Must be set if and only if type is "Localhost".
                            type: string
                          type:
                            description: |-
                              type indicates which kind of AppArmor profile will be applied.
                              Valid options are:
                                Localhost - a profile pre-loaded on the node.
                                RuntimeDefault - the container runtime's default profile.
                                Unconfined - no AppArmor enforcement.
                            type: string
                        required:
                        - type
                        type: object
                      fsGroup:
                        description: |-
                          A special supplemental group that applies to all containers in a pod.
                          Some volume types allow the Kubelet to change the ownership of that volume
                          to be owned by the pod:

                          1. The owning GID will be the FSGroup
                          2. The setgid bit is set (new files created in the volume will be owned by FSGroup)
                          3. The permission bits are OR'd with rw-rw----

                          If unset, the Kubelet will not modify the ownership and permissions of any volume.
                          Note that this field cannot be set when spec.os.name is windows.
                        format: int64
                        type: integer
                      fsGroupChangePolicy:
                        description: |-
                          fsGroupChangePolicy defines behavior of changing ownership and permission of the volume
                          before being exposed inside Pod. This field will only apply to
                          volume types which support fsGroup based ownership(and permissions).
                          It will have no effect on ephemeral volume types such as: secret, configmaps
                          and emptydir.
                          Valid values are "OnRootMismatch" and "Always". If not specified, "Always" is used.
                          Note that this field cannot be set when spec.os.name is windows.
                        type: string
                      runAsGroup:
                        description: |-
                          The GID to run the entrypoint of the container process.
                          Uses runtime default if unset.
                          May also be set in SecurityContext.  If set in both SecurityContext and
                          PodSecurityContext, the value specified in SecurityContext takes precedence
                          for that container.
                          Note that this field cannot be set when spec.os.name is windows.
                        format: int64
                        type: integer
                      runAsNonRoot:
                        description: |-
                          Indicates that the container must run as a non-root user.
                          If true, the Kubelet will validate the image at runtime to ensure that it
                          does not run as UID 0 (root) and fail to start the container if it does.
                          If unset or false, no such validation will be performed.
                          May also be set in SecurityContext.  If set in both SecurityContext and
                          PodSecurityContext, the value specified in SecurityContext takes precedence.
                        type: boolean
                      runAsUser:
                        description: |-
                          The UID to run the entrypoint of the container process.
                          Defaults to user specified in image metadata if unspecified.
                          May also be set in SecurityContext.  If set in both SecurityContext and
                          PodSecurityContext, the value specified in SecurityContext takes precedence
                          for that container.
                          Note that this field cannot be set when spec.os.name is windows.
                        format: int64
                        type: integer
                      seLinuxOptions:
                        description: |-
                          The SELinux context to be applied to all containers.
                          If unspecified, the container runtime will allocate a random SELinux context for each
                          container.  May also be set in SecurityContext.  If set in
                          both SecurityContext and PodSecurityContext, the value specified in SecurityContext
                          takes precedence for that container.
                          Note that this field cannot be set when spec.os.name is windows.
                        properties:
                          level:
                            description: Level is SELinux level label that applies
                              to the container.
                            type: string
                          role:
                            description: Role is a SELinux role label that applies
                              to the container.
                            type: string
                          type:
                            description: Type is a SELinux type label that applies
                              to the container.
                            type: string
                          user:
                            description: User is a SELinux user label that applies
                              to the container.
                            type: string
                        type: object
                      seccompProfile:
                        description: |-
                          The seccomp options to use by the containers in this pod.
                          Note that this field cannot be set when spec.os.name is windows.
                        properties:
                          localhostProfile:
                            description: |-
                              localhostProfile indicates a profile defined in a file on the node should be used.
                              The profile must be preconfigured on the node to work.
                              Must be a descending path, relative to the kubelet's configured seccomp profile location.
                              Must be set if type is "Localhost". Must NOT be set for any other type.
                            type: string
                          type:
                            description: |-
                              type indicates which kind of seccomp profile will be applied.
                              Valid options are:

                              Localhost - a profile defined in a file on the node should be used.
                              RuntimeDefault - the container runtime default profile should be used.
                              Unconfined - no profile should be applied.
                            type: string
                        required:
                        - type
                        type: object
                      supplementalGroups:
                        description: |-
                          A list of groups applied to the first process run in each container, in
                          addition to the container's primary GID and fsGroup (if specified).  If
                          the SupplementalGroupsPolicy feature is enabled, the
                          supplementalGroupsPolicy field determines whether these are in addition
                          to or instead of any group memberships defined in the container image.
                          If unspecified, no additional groups are added, though group memberships
                          defined in the container image may still be used, depending on the
                          supplementalGroupsPolicy field.
                          Note that this field cannot be set when spec.os.name is windows.
                        items:
                          format: int64
                          type: integer
                        type: array
                        x-kubernetes-list-type: atomic
                      supplementalGroupsPolicy:
                        description: |-
                          Defines how supplemental groups of the first container processes are calculated.
                          Valid values are "Merge" and "Strict". If not specified, "Merge" is used.
                          (Alpha) Using the field requires the SupplementalGroupsPolicy feature gate to be enabled
                          and the container runtime must implement support for this feature.
                          Note that this field cannot be set when spec.os.name is windows.
                        type: string
                      sysctls:
                        description: |-
                          Sysctls hold a list of namespaced sysctls used for the pod. Pods with unsupported
                          sysctls (by the container runtime) might fail to launch.
                          Note that this field cannot be set when spec.os.name is windows.
                        items:
                          description: Sysctl defines a kernel parameter to be set
                          properties:
                            name:
                              description: Name of a property to set
                              type: string
                            value:
                              description: Value of a property to set
                              type: string
                          required:
                          - name
                          - value
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      windowsOptions:
                        description: |-
                          The Windows specific settings applied to all containers.
                          If unspecified, the options within a container's SecurityContext will be used.
                          If set in both SecurityContext and PodSecurityContext, the value specified in SecurityContext takes precedence.
                          Note that this field cannot be set when spec.os.name is linux.
                        properties:
                          gmsaCredentialSpec:
                            description: |-
                              GMSACredentialSpec is where the GMSA admission webhook
                              (https://github.com/kubernetes-sigs/windows-gmsa) inlines the contents of the
                              GMSA credential spec named by the GMSACredentialSpecName field.
                            type: string
                          gmsaCredentialSpecName:
                            description: GMSACredentialSpecName is the name of the
                              GMSA credential spec to use.
                            type: string
                          hostProcess:
                            description: |-
                              HostProcess determines if a container should be run as a 'Host Process' container.
                              All of a Pod's containers must have the same effective HostProcess value
                              (it is not allowed to have a mix of HostProcess containers and non-HostProcess containers).
                              In addition, if HostProcess is true then HostNetwork must also be set to true.
                            type: boolean
                          runAsUserName:
                            description: |-
                              The UserName in Windows to run the entrypoint of the container process.
                              Defaults to the user specified in image metadata if unspecified.
                              May also be set in PodSecurityContext. If set in both SecurityContext and
                              PodSecurityContext, the value specified in SecurityContext takes precedence.
                            type: string
                        type: object
                    type: object
                type: object
              server:
                description: Server configures the Studio HTTP(S) listener (e.g. TLS).
                properties:
                  tls:
                    description: TLS enables HTTPS on Studio's listener.
                    properties:
                      enabled:
                        description: Enabled turns on HTTPS on server.port.
                        type: boolean
                      secretRef:
                        description: SecretRef names the kubernetes.io/tls Secret
                          with the server certificate and key.
                        properties:
                          name:
                            description: Name of the Secret in the same namespace.
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - enabled
                    - secretRef
                    type: object
                type: object
              tools:
                description: Tools toggles which tools appear in the Studio UI.
                properties:
                  bloom:
                    type: boolean
                  dashboards:
                    type: boolean
                  query:
                    type: boolean
                type: object
              version:
                description: Version is the Studio image tag; a bump is a rolling
                  Deployment update (stateless — BDR-015 §10).
                minLength: 1
                type: string
            required:
            - assetStore
            - deployments
            - version
            type: object
          status:
            description: Neo4jStudioStatus is the observed state of a Neo4jStudio
              (ADR-018).
            properties:
              conditions:
                description: |-
                  Conditions are Kubernetes-standard signals; Ready is gated on the Deployment being Available
                  and the asset DB being reachable.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              deployments:
                description: Deployments reports per-deployment resolution and reachability.
                items:
                  description: StudioDeploymentStatus is the resolved, observed state
                    of one served deployment.
                  properties:
                    name:
                      description: Name mirrors spec.deployments[].name.
                      type: string
                    reachable:
                      description: Reachable reports whether the operator could reach
                        this deployment.
                      type: boolean
                    resolvedUri:
                      description: ResolvedURI is the client URI the operator resolved
                        (from neo4jRef) or echoed (external uri).
                      type: string
                  required:
                  - name
                  type: object
                type: array
              message:
                description: Message is a human-readable detail.
                type: string
              observedGeneration:
                description: ObservedGeneration is the last spec generation reconciled.
                format: int64
                type: integer
              phase:
                description: Phase is the coarse lifecycle state.
                enum:
                - Pending
                - Running
                - Degraded
                - Failed
                type: string
              reason:
                description: Reason is a stable machine reason (oracle catalog) when
                  Degraded/Failed.
                type: string
              url:
                description: URL is the resolved external URL of Studio (from the
                  Service/Ingress).
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
