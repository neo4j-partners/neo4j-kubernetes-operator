---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: neo4jbackupschedules.neo4j.com
spec:
  group: neo4j.com
  names:
    kind: Neo4jBackupSchedule
    listKind: Neo4jBackupScheduleList
    plural: neo4jbackupschedules
    shortNames:
    - n4jbs
    singular: neo4jbackupschedule
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.neo4jRef.name
      name: Cluster
      type: string
    - jsonPath: .spec.full.schedule
      name: Full
      type: string
    - jsonPath: .spec.suspend
      name: Suspend
      type: boolean
    - jsonPath: .status.lastFullTime
      name: Last-Full
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: Neo4jBackupSchedule is the cron and chain owner that emits Neo4jBackup
          objects (BDR-014).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Neo4jBackupScheduleSpec owns cron cadences, retention, and
              the chain (BDR-014 §10).
            properties:
              aggregate:
                description: Aggregate optionally compacts a chain into one recovered
                  full.
                properties:
                  enabled:
                    default: false
                    description: |-
                      Enabled compacts each closed chain: once every link has Succeeded, the schedule emits an
                      aggregate Neo4jBackup for it and, once that recovered full is cataloged, prunes the chain's
                      original links (keeping the recovered full). Never touches the active chain.
                    type: boolean
                type: object
              backupTemplate:
                description: BackupTemplate is the inline Neo4jBackup spec each cadence
                  emits.
                properties:
                  databases:
                    default:
                    - '*'
                    description: Databases to back up; "*" means all including system.
                    items:
                      type: string
                    minItems: 1
                    type: array
                  destination:
                    description: Destination is where artifacts land (inherited by
                      every emitted Neo4jBackup).
                    properties:
                      credentials:
                        description: Credentials references cloud credentials; omit
                          for workload identity.
                        properties:
                          secretName:
                            description: SecretName is a Secret in the same namespace
                              with the provider credentials.
                            minLength: 1
                            type: string
                        required:
                        - secretName
                        type: object
                      pvc:
                        description: PVC targets an in-cluster volume. Required when
                          type is pvc.
                        properties:
                          claimName:
                            description: ClaimName binds an existing PersistentVolumeClaim.
                            type: string
                          size:
                            description: Size provisions a new claim (e.g. 100Gi).
                              Ceiling enforced in admission.
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            type: string
                          storageClassName:
                            description: StorageClassName for a provisioned claim
                              (omit for the cluster default).
                            type: string
                        type: object
                        x-kubernetes-validations:
                        - message: set pvc.claimName (existing) or pvc.size (provision),
                            not both
                          rule: has(self.claimName) != (has(self.size) || has(self.storageClassName))
                      type:
                        description: Type selects the store backend.
                        enum:
                        - s3
                        - gcs
                        - azure
                        - pvc
                        type: string
                      url:
                        description: |-
                          URL is the provider URI for object storage (s3://…, gs://…, azb://…), mapping
                          to neo4j-admin --to-path. Required unless type is pvc.
                        type: string
                    required:
                    - type
                    type: object
                    x-kubernetes-validations:
                    - message: object-store destinations require url (not pvc); pvc
                        destinations require pvc (not url)
                      rule: 'self.type == ''pvc'' ? (has(self.pvc) && !has(self.url))
                        : (has(self.url) && !has(self.pvc))'
                  options:
                    description: Options is neo4j-admin passthrough inherited by every
                      emitted Neo4jBackup.
                    properties:
                      compress:
                        description: Compress → --compress (Neo4j default true).
                        type: boolean
                      extraArgs:
                        description: |-
                          ExtraArgs is an allow-listed escape hatch for advanced/version-gated flags.
                          Validated by the webhook against an allowlist and rejected if it collides with
                          an operator-owned flag (BDR-014 §12).
                        items:
                          type: string
                        maxItems: 32
                        type: array
                      includeMetadata:
                        description: IncludeMetadata → --include-metadata (default
                          all; ignored for system).
                        enum:
                        - none
                        - all
                        - users
                        - roles
                        type: string
                      keepFailed:
                        description: 'KeepFailed → --keep-failed: preserve a failed
                          backup dir for analysis.'
                        type: boolean
                      verbose:
                        description: Verbose → --verbose.
                        type: boolean
                    type: object
                required:
                - destination
                type: object
              full:
                description: Full is the cron that anchors a new backup chain (--type=FULL).
                properties:
                  retention:
                    description: Retention bounds how many whole chains are kept;
                      older chains are pruned entirely.
                    properties:
                      keepDays:
                        description: KeepDays keeps chains whose anchoring full is
                          younger than N days.
                        format: int32
                        minimum: 1
                        type: integer
                      keepLast:
                        description: KeepLast keeps the last N whole chains; older
                          chains are pruned entirely.
                        format: int32
                        minimum: 1
                        type: integer
                    type: object
                    x-kubernetes-validations:
                    - message: set keepLast or keepDays, not both
                      rule: '!(has(self.keepLast) && has(self.keepDays))'
                  schedule:
                    description: Schedule is a standard cron expression.
                    minLength: 1
                    type: string
                required:
                - schedule
                type: object
              incremental:
                description: Incremental attaches to the current chain (--type=AUTO).
                  Omit for full-only.
                properties:
                  schedule:
                    description: Schedule is a standard cron expression.
                    minLength: 1
                    type: string
                required:
                - schedule
                type: object
              neo4jRef:
                description: Neo4jRef is the target workload (same namespace).
                properties:
                  name:
                    description: Name of the target Neo4j resource in the same namespace.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              suspend:
                description: Suspend pauses all cadences without deleting the schedule.
                type: boolean
            required:
            - backupTemplate
            - full
            - neo4jRef
            type: object
          status:
            description: Neo4jBackupScheduleStatus is the observed state of the schedule.
            properties:
              conditions:
                description: Conditions are Kubernetes-standard signals.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              currentChain:
                description: CurrentChain is the id of the full anchoring the active
                  chain.
                type: string
              lastBackup:
                description: LastBackup is the name of the most recent emitted Neo4jBackup.
                type: string
              lastFullTime:
                description: LastFullTime / LastIncrementalTime are the last emission
                  times per cadence.
                format: date-time
                type: string
              lastIncrementalTime:
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the last spec generation reconciled.
                format: int64
                type: integer
              suspended:
                description: Suspended mirrors spec.suspend as observed.
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
