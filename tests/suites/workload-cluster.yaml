name: workload-cluster
description: >
  NEO-2-002 Cluster mode — members are created, the cluster actually forms
  (SHOW SERVERS: Enabled + Available), the default database is allocated on the
  declared number of primaries and stays reachable through routing from members
  that do not host it, and routing works through the client Service.
  Covers AC-NEO-CLUSTER-001/002/003.
brief_ref: slice-cluster
use_pipeline: neo4j-suite
on_case_failure: continue
# Members → probes → formation → database allocation → routing → status, cheapest check
# first so a failure reports the most specific cause. Cluster pods are <cr>-primary-N
# (pool StatefulSets), which the cluster-* cases select via NEO4J_POOL.
#
# probes-default runs here too, and this is where its startup budget matters: the 1000 x 5s
# threshold exists so a forming cluster is not killed by the kubelet. It inspects the
# primary pool StatefulSet only. status-conditions runs after the CR has settled.
#
# The mutating steps come last because they change the declared shape, so every assertion above
# them describes the cluster as the case declared it. Each is a no-op unless the case declares its
# trigger — STORAGE_GROW_TO to grow the volumes, CLUSTER_SCALE_OUT_MEMBERS for the primary pool,
# SECONDARY_SCALE_POOL for a secondary one (a case cannot carry its own step list). No case declares
# more than one of the three.
#
# storage-grow runs here rather than in feature-storage because it needs a real multi-member pool:
# one patch of the CR has to reach every ordinal's claim, and the StatefulSet template it cannot
# touch is shared by all of them.
pipeline:
  case_assert:
    - assert/cluster-members
    - assert/probes-default
    - assert/cluster-formed
    - assert/cluster-db-topology
    - assert/cluster-db-routing
    - assert/cluster-routing
    - assert/status-conditions
    - assert/storage-grow
    - assert/cluster-scale-out-in
    - assert/cluster-scale-secondary

cases:
  - id: lab-single-primary
    comment: Lab topology of 1 primary, no quorum — cheap proof that Cluster mode renders, boots and forms on a small runner.
    fixture: tests/fixtures/neo4j-cluster-single.yaml
    neo4j_case: cluster-single
    expect: success
    cr_name: e2e-cluster-lab

  - id: ha-3-primaries
    comment: Smallest real HA topology (3 primaries, quorum of 3) with defaultPrimariesCount=3, so the neo4j database spans every primary.
    fixture: tests/fixtures/neo4j-cluster-3primaries.yaml
    neo4j_case: cluster-3primaries
    expect: success
    cr_name: e2e-cluster-ha

  - id: ha-3-primaries-default-db
    comment: Same 3-primary shape with defaultPrimariesCount omitted — pins the default of 1, the neo4j database sits on one primary and the other two reach it through routing.
    fixture: tests/fixtures/neo4j-cluster-3primaries-default-db.yaml
    neo4j_case: cluster-3primaries-default-db
    expect: success
    cr_name: e2e-cluster-defaultdb

  - id: scale-out-in
    comment: Scale out 3 to 5 primaries then back in to 3 on one cluster — added members are enabled by the operator, a database asking for more primaries than the target does not block the shrink, and the StatefulSet is held until Neo4j has released the drained servers.
    fixture: tests/fixtures/neo4j-cluster-3primaries.yaml
    neo4j_case: cluster-scale-out-in
    expect: success
    cr_name: e2e-cluster-scale

  - id: storage-grow
    comment: Grow the data volume 5Gi to 10Gi on a formed 3-primary cluster — one patch of the CR must reach all three claims, since the StatefulSet's volumeClaimTemplate is immutable and keeps the original size. Readiness used to be read from ordinal 0 alone, which would have hidden two members left on the old size.
    fixture: tests/fixtures/neo4j-cluster-3primaries.yaml
    neo4j_case: cluster-storage-grow
    expect: success
    cr_name: e2e-cluster-grow

  - id: scale-secondary
    comment: Scale a read pool 1 to 2 then back in to 1 on a single-primary cluster — a departing secondary ends up hosting only the system database, which Neo4j can keep reporting as Deallocating, so the operator releases it on what it hosts rather than on that label. The primary must not move in either direction.
    fixture: tests/fixtures/neo4j-cluster-single-read.yaml
    neo4j_case: cluster-scale-secondary
    expect: success
    cr_name: e2e-cluster-scale-read
