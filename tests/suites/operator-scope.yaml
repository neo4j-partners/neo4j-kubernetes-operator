name: operator-scope
description: >
  OP-2-001-SCOPE-02 — the namespace-scoped operator reconciles CRs in every namespace listed in
  WATCH_NAMESPACE, ignores CRs outside it, and its RBAC stays namespaced with one Role per watched
  namespace and no cluster-wide grant. Installed from the Helm chart, the only install path that
  can express a multi-namespace scope. Covers AC-OP-SCOPE-MULTI-001/002 and, as their
  single-namespace case, AC-OP-SCOPE-SINGLE-002/003/004.
brief_ref: slice-scope
use_pipeline: scope-suite
on_case_failure: stop
pipeline:
  case_assert:
    # MULTI-001 every watched namespace reconciled, SINGLE-003 negative control,
    # MULTI-002 least-privilege RBAC.
    - assert/reconciled-in-namespace
    - assert/scope-ignored
    - assert/rbac-namespaced

# Single case; the namespaces and CR names come from the scope defaults
# (E2E_SCOPE_WATCHED_NAMESPACES / E2E_SCOPE_WATCHED_CR / E2E_SCOPE_NAMESPACE), not from case fields.
cases:
  - id: watched-and-unwatched-namespaces
    comment: OP-2-001-SCOPE-02 — a CR in each watched namespace is reconciled, a CR outside WATCH_NAMESPACE is left untouched, every watched namespace holds an identical manager Role, and the operator holds no cluster-wide grant.
    expect: success
