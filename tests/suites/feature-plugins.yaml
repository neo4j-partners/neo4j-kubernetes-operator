name: feature-plugins
description: Plugin surface (spec.plugins / spec.pluginDefinitions) — runtime procedures, licence mounting, per-plugin config, and the manual-import channel
brief_ref: neo4j-plugin-surface
use_pipeline: neo4j-suite
on_case_failure: continue
clouds: [local-kind]

# Runtime plugin behaviour (BDR-004). The unit tests already prove every render decision —
# the NEO4J_PLUGINS string, the ConfigMap keys, the volume shapes — so every case here is
# something only a real container can show: the JAR actually arrived, the procedure answers,
# the licence file is where the code (not the doc) says it is.
#
# NOTE: the operator contains no download logic. It sets NEO4J_PLUGINS and the official image
# fetches the JARs at container start, so the download cases need outbound network on the node.
# A jar-host outage fails those cases; on_case_failure: continue keeps it from hiding the rest.
#
# Standalone only: every catalog plugin is legal in spec.plugins, and staying on one topology
# keeps NEO4J_POOL at its "server" default for every case.
#
# Licences are dummies — this suite asserts the operator's plumbing, never that GDS or Bloom
# validate a licence, so it runs in CI without any licence material.
pipeline:
  case_assert:
    - assert/{{assert}}
  case_teardown:
    - storage/cleanup-extra

cases:
  - id: apoc-runtime
    comment: APOC assigned via spec.plugins — the JAR downloads at container start and apoc.version() answers over bolt.
    fixture: tests/fixtures/neo4j-plugins-apoc.yaml
    assert: plugins-apoc
    expect: success
    cr_name: plg-apoc

  - id: gds-runtime
    comment: GDS assigned without a licenceSecretRef — Community mode boots and gds.version() answers over bolt.
    fixture: tests/fixtures/neo4j-plugins-gds.yaml
    assert: plugins-gds
    expect: success
    cr_name: plg-gds

  - id: procedure-allowlists
    comment: Two plugins assigned — the generated procedure allowlists carry both patterns and are effective on the running server.
    fixture: tests/fixtures/neo4j-plugins-apoc-gds.yaml
    assert: plugins-allowlist
    expect: success
    cr_name: plg-allow

  - id: bloom-license-mounted
    comment: Bloom assigned with a dummy licence Secret — mounted read-only at /licenses/bloom with the Secret key as filename.
    fixture: tests/fixtures/neo4j-plugins-bloom.yaml
    assert: plugins-license
    expect: success
    cr_name: plg-bloom

  - id: plugin-config-runtime
    comment: pluginDefinitions.apoc.config merges into neo4j.conf and the value is effective at runtime.
    fixture: tests/fixtures/neo4j-plugins-config.yaml
    assert: plugins-config
    expect: success
    cr_name: plg-cfg

  - id: license-secret-unlabeled
    comment: Licence Secret without the mountable opt-in label is refused at reconcile with Error/SecretNotMountable and nothing is deployed.
    fixture: tests/fixtures/neo4j-plugins-unlabeled.yaml
    neo4j_case: standalone-plugin-license-unlabeled
    assert: reconcile-error
    expect: success
    cr_name: plg-nolbl

  - id: import-volume
    comment: Pre-created PVC mounted at /plugins with no spec.plugins entry — the manual-import channel, with NEO4J_PLUGINS left unset.
    fixture: tests/fixtures/neo4j-plugins-import.yaml
    assert: plugins-import
    expect: success
    cr_name: plg-imp
