name: feature-storage
description: Storage surface (spec.storage) — data modes, aux Share, additionalMounts, and invalid-storage failures
brief_ref: neo4j-storage-surface
use_pipeline: storage-suite
on_case_failure: continue
clouds: [local-kind]

# Each case picks its own assertion; apply always succeeds at admission, so the
# "fail" cases (bad StorageClass / missing PVC) are asserted at runtime.
#
# NOTE: the three PVC-impossible cases use assert/storage-error. Decision: on a PVC that
# cannot bind, the operator stays PENDING (not Failed) and surfaces the cause on the
# StorageReady condition (StorageReady=False/PVCPending, message mentions the PVC and
# storageClassName). The message currently lives on the condition only — the operator does
# not emit a Kubernetes Event for it yet.
pipeline:
  case_assert:
    - assert/{{assert}}

cases:
  - id: dynamic-sc-ok
    comment: Dynamic data volume with an explicit storageClassName — the PVC is provisioned and the server boots.
    fixture: tests/fixtures/neo4j-storage-dynamic-sc.yaml
    assert: storage-sc
    expect: success
    cr_name: st-dyn-sc

  - id: dynamic-sc-fail
    comment: Dynamic data volume with a non-existent storageClassName — the operator stays Pending with StorageReady=False/PVCPending, never Failed nor Ready.
    fixture: tests/fixtures/neo4j-storage-dynamic-sc-bad.yaml
    assert: storage-error
    expect: success
    cr_name: st-dyn-scbad

  - id: claimname-ok
    comment: Existing data volume referencing a pre-created PVC by claimName, bundled in the fixture.
    fixture: tests/fixtures/neo4j-storage-claimname.yaml
    assert: storage-claimname
    expect: success
    cr_name: st-claim

  - id: claimname-fail
    comment: claimName pointing at a PVC that does not exist — the operator stays Pending with StorageReady=False/PVCPending, never Failed nor Ready.
    fixture: tests/fixtures/neo4j-storage-claimname-missing.yaml
    assert: storage-error
    expect: success
    cr_name: st-claimmiss

  - id: vct-ok
    comment: Existing data volume via a raw volumeClaimTemplate — the operator provisions data-<cr>-server-0.
    fixture: tests/fixtures/neo4j-storage-vct.yaml
    assert: storage-vct
    expect: success
    cr_name: st-vct

  - id: vct-fail
    comment: volumeClaimTemplate with a non-existent storageClassName — the operator stays Pending with StorageReady=False/PVCPending, never Failed nor Ready.
    fixture: tests/fixtures/neo4j-storage-vct-bad.yaml
    assert: storage-error
    expect: success
    cr_name: st-vctbad

  - id: emptydir
    comment: Existing data volume via an inline emptyDir (ephemeral) — /data is mounted and no PVC is created.
    fixture: tests/fixtures/neo4j-storage-emptydir.yaml
    assert: storage-emptydir
    expect: success
    cr_name: st-empty

  - id: share-logs-metrics
    comment: logs and metrics Share the data volume — verified as real mounts at /logs and /metrics.
    fixture: tests/fixtures/neo4j-storage-share.yaml
    assert: storage-share
    expect: success
    cr_name: st-share

  - id: additional-mounts
    comment: additionalMounts with an arbitrary volume name — verified as a mount at its mountPath.
    fixture: tests/fixtures/neo4j-storage-additional.yaml
    assert: storage-additional
    expect: success
    cr_name: st-add
