name: feature-password-rotation
description: >
  Neo4jPasswordRotation end to end (BDR-017 / ADR-019). Deploys an Enterprise Standalone Neo4j with a
  generated bootstrap password and waits Ready, then stages a new credential in its own delegated
  Secret and files a Neo4jPasswordRotation. The operator authenticates with the still-live old value,
  runs ALTER USER neo4j SET PASSWORD over the system database, and writes the new value into <cr>-auth.
  Asserts the record reaches Succeeded (RotationReady=True/RotationSucceeded), the live auth Secret is
  synced to the new password, the new password authenticates over Bolt, and the old password is now
  rejected — proving the ALTER landed in the database, not just that the Secret was rewritten.
brief_ref: neo4j-password-rotation
use_pipeline: neo4j-suite
on_case_failure: stop
# deploy/neo4j (case_run) applies the target; rotation/apply runs only after the workload is Ready, so
# the admin session dials a live leader and never races the target's boot.
pipeline:
  case_assert:
    - assert/standalone-ready
    - rotation/apply
    - assert/rotation-succeeded
  case_teardown:
    - rotation/cleanup

cases:
  - id: standalone-generated
    comment: ADR-019 — an externally staged password is applied over admin Bolt; the old value stays live until the ALTER lands, then <cr>-auth is synced.
    fixture: tests/fixtures/neo4j-rotation.yaml
    assert: rotation-succeeded
    expect: success
    cr_name: e2e-rotation
