name: feature-config
description: >
  Neo4j server config surface (spec.config) — passthrough, invalid-setting handling, and a
  live config change applied via a controlled restart (NEO-2-010, folded in from the former
  feature-config-change suite).
brief_ref: neo4j-config-surface
use_pipeline: neo4j-suite
on_case_failure: continue
clouds: [local-kind]

pipeline:
  case_assert:
    - assert/{{assert}}

cases:
  - id: passthrough
    comment: AC-NEO-CONFIG-001 — a valid setting reaches the running server, SHOW SETTINGS over bolt reports the value the fixture set in spec.config.neo4j.
    fixture: tests/fixtures/neo4j-config-valid.yaml
    assert: config-runtime
    expect: success
    cr_name: e2e-cfg-ok

  - id: unknown-key
    comment: AC-NEO-CONFIG-002 — an unknown setting is admitted by the operator but rejected by Neo4j at startup.
    fixture: tests/fixtures/neo4j-config-unknown.yaml
    assert: config-startup-error
    expect: success
    # expect_contains is a single token (suite parser splits on whitespace);
    # 'Unrecognized' is enough to match Neo4j's strict-validation error.
    expect_contains: Unrecognized
    cr_name: e2e-cfg-unknown

  # The two JVM cases are a pair — useDefaults false here, true below.
  - id: jvm-additional-args
    comment: NEO-3-003-JVM-02 — spec.config.jvm.additionalArguments take effect, SHOW SETTINGS server.jvm.additional contains the custom flag and useDefaults false keeps the Neo4j defaults out.
    fixture: tests/fixtures/neo4j-config-jvm.yaml
    assert: config-jvm-runtime
    expect: success
    cr_name: e2e-cfg-jvm

  - id: jvm-use-defaults
    comment: NEO-3-003-JVM-01 — useDefaults true injects the Neo4j default JVM arguments ahead of the user argument, and they reach the running server.
    fixture: tests/fixtures/neo4j-config-jvm-defaults.yaml
    assert: config-jvm-defaults
    expect: success
    cr_name: e2e-cfg-jvmdef

  - id: jvm-override-defaults
    comment: NEO-3-003-JVM-01 — an additionalArguments entry colliding with a Neo4j default wins and replaces it in place, and the drop is reported on a DuplicateEntry Warning Event plus the operator log.
    fixture: tests/fixtures/neo4j-config-jvm-override.yaml
    assert: config-jvm-override
    expect: success
    cr_name: e2e-cfg-jvmovr

  # Runtime procedure availability belongs to the planned feature-plugins suite.
  - id: apoc-config
    comment: NEO-3-003-APOC-01 — apoc.* config renders into the dedicated <cr>-apoc-config (apoc.conf) when APOC is assigned via spec.plugins.
    fixture: tests/fixtures/neo4j-config-apoc.yaml
    assert: config-apoc-rendered
    expect: success
    cr_name: e2e-cfg-apoc

  - id: config-change-restart
    comment: NEO-2-010 / NEO-3-010-RSTR-01 — changing spec.config on a running Neo4j is applied end-to-end, from ConfigMap render to controlled restart to the new value reported by SHOW SETTINGS.
    fixture: tests/fixtures/neo4j-standalone.yaml
    assert: config-restart
    expect: success
    cr_name: e2e-cfgchange
