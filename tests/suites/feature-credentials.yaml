name: feature-credentials
description: Bootstrap credentials — generated vs referenced Secret over bolt, plus refused Secrets
brief_ref: neo4j-credentials
use_pipeline: credentials-suite
on_case_failure: continue
clouds: [local-kind]

# NOTE: a BYO auth Secret needs two opt-in labels — neo4j.com/mountable-by-operator=true
# (NEO-005) and neo4j.com/allowed-for=<CR name> (ADD-01). The negative cases drop one or both
# via AUTH_SECRET_LABELS and assert the refusal on a stable oracle reason
# (src/internal/status/oracle.go), never on the message text.

pipeline:
  case_assert:
    - assert/{{assert}}

cases:
  - id: generated
    comment: Generated password — the operator creates <cr>-auth and that password authenticates a bolt query.
    neo4j_case: standalone-auth-generated
    fixture: tests/fixtures/neo4j-standalone.yaml
    assert: credentials
    expect: success
    cr_name: dev-gen

  - id: secret-ref
    comment: Referenced Secret — the operator uses a pre-created, fully labelled Secret and its password authenticates a bolt query.
    neo4j_case: standalone-auth-secretref
    fixture: tests/fixtures/neo4j-auth-secret-ref.yaml
    assert: credentials
    expect: success
    cr_name: dev-secref

  # `expect: success` describes the apply — the webhook is off, so nothing rejects the CR at
  # admission; the operator refuses the Secret afterwards and deploys nothing.
  - id: secret-ref-unlabeled
    comment: Secret without the mountable opt-in label is refused at reconcile with Error/SecretNotMountable (NEO-005).
    neo4j_case: standalone-auth-secretref-unlabeled
    fixture: tests/fixtures/neo4j-auth-secret-ref.yaml
    assert: reconcile-error
    expect: success
    cr_name: dev-unlabeled

  - id: secret-ref-not-delegated
    comment: Secret mountable but not delegated to this CR is refused with Error/SecretNotDelegated (ADD-01).
    neo4j_case: standalone-auth-secretref-undelegated
    fixture: tests/fixtures/neo4j-auth-secret-ref.yaml
    assert: reconcile-error
    expect: success
    cr_name: dev-undelegated
