name: feature-ports
description: >
  Port-combination exposure on the client Service (NEO-3-007-PCMB). Exposure-only: Neo4j keeps
  listening on every connector inside the pod; connectivity.service.expose selects which ones the
  client Service publishes. Bolt must always be exposed — the operator manages Neo4j over Bolt via
  the client Service (CEL-enforced). Combos that drop Bolt (PCMB-02/06) are out of scope until the
  operator's Bolt dial is decoupled from the client Service.
brief_ref: neo4j-networking-ports
use_pipeline: neo4j-suite
on_case_failure: continue
pipeline:
  case_assert:
    - assert/{{assert}}

cases:
  - id: bolt-only
    comment: NEO-3-007-PCMB-01 — connectivity.service.expose [bolt] publishes only the Bolt connector on the client Service; HTTP and HTTPS are not exposed, and Neo4j still reaches Ready over Bolt.
    fixture: tests/fixtures/neo4j-ports-bolt-only.yaml
    assert: ports-bolt-only
    expect: success
    cr_name: e2e-ports-bolt
