# Two plugins assigned so the generated procedure allowlist carries both patterns.
# The operator derives dbms.security.procedures.allowlist from the assigned ids
# (operator_defaults.go) and leaves dbms.security.procedures.unrestricted unset — the
# assert checks both halves (NEO-024). No spec.config.neo4j here on purpose: a user
# override would replace the generated value and the case would prove nothing.
apiVersion: neo4j.com/v1
kind: Neo4j
metadata:
  name: __CR_NAME__
spec:
  edition: enterprise
  version: "2026.05.0"
  license:
    accept: "yes"
  topology:
    mode: Standalone
  storage:
    volumes:
      data:
        mode: Dynamic
        dynamic:
          size: __DATA_SIZE__
          storageClassName: __STORAGE_CLASS__
  auth:
    generatePassword: true
  plugins: [apoc, gds]
  pluginDefinitions:
    apoc: {}
    gds: {}
