# APOC assigned via spec.plugins. The operator only sets NEO4J_PLUGINS=["apoc"]; the image
# entrypoint installs the JAR at container start from /var/lib/neo4j/labs, where the
# Enterprise image already ships it — no network needed. No config.apoc here: apoc.conf
# rendering is feature-config's job, this one is about the procedure being callable.
apiVersion: neo4j.com/v1beta1
kind: Neo4j
metadata:
  name: __CR_NAME__
spec:
  edition: enterprise
  version: "2026.05.0"
  license:
    accept: "yes"
  topology:
    mode: Standalone
  storage:
    volumes:
      data:
        mode: Dynamic
        dynamic:
          size: __DATA_SIZE__
          storageClassName: __STORAGE_CLASS__
  auth:
    generatePassword: true
  plugins: [apoc]
  pluginDefinitions:
    apoc: {}
