apiVersion: neo4j.com/v1beta1
kind: Neo4j
metadata:
  name: __CR_NAME__
spec:
  edition: enterprise
  version: "__NEO4J_VERSION__"
  license:
    accept: "yes"
  topology:
    mode: Standalone
  storage:
    volumes:
      data:
        mode: Dynamic
        dynamic:
          size: __DATA_SIZE__
          storageClassName: __STORAGE_CLASS__
  auth:
    generatePassword: true
  # Strict validation OFF is the mirror of neo4j-config-unknown.yaml (strict ON): the same
  # unknown setting is present, but with strict_validation disabled Neo4j downgrades it from a
  # fatal startup error to a warning, so the server boots and becomes Ready (NEO-3-003-CFG-02).
  config:
    neo4j:
      server.config.strict_validation.enabled: "false"
      dbms.this_setting_does_not_exist: "true"
