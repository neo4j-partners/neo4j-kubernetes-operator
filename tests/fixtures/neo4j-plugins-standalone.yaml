# Standalone with two catalog plugins assigned (NEO-3-003-APOC-01 / BDR-004). This is the RUNTIME
# half of plugins — distinct from feature-config's apoc-config case, which only checks apoc.* keys
# render into apoc.conf. Here the procedures must actually be callable over bolt.
#
# APOC + GDS are the two verifiable-on-a-runner plugins: declaring them sets NEO4J_PLUGINS, the
# Neo4j image downloads the JARs at start, and the operator opens dbms.security.procedures.allowlist
# to apoc.*/gds.*. Neither needs a license to answer a version function — GDS runs in Community form
# without one (a license only unlocks Enterprise features), so no licenseSecretRef is set and no
# license Secret has to exist. Bloom is intentionally left out: it is an unmanaged HTTP extension,
# not Cypher procedures, and needs a real license to run — nothing a bolt query can prove on a runner.
#
# Only `name: __CR_NAME__` and the storage placeholders are substituted by the harness.
apiVersion: neo4j.com/v1beta1
kind: Neo4j
metadata:
  name: __CR_NAME__
spec:
  edition: enterprise
  version: "2026.05.0"
  license:
    accept: "yes"
  topology:
    mode: Standalone
  storage:
    volumes:
      data:
        mode: Dynamic
        dynamic:
          size: __DATA_SIZE__
          storageClassName: __STORAGE_CLASS__
  auth:
    generatePassword: true
  plugins: [apoc, gds]
  pluginDefinitions:
    apoc: {}
    gds: {}
