# Community is a supported edition, but clustering is not part of it: EDT-001 confines community to
# Standalone, so this CR is refused at admission. The license block is accepted and simply ignored —
# community ships under GPLv3 with nothing to accept.
apiVersion: neo4j.com/v1beta1
kind: Neo4j
metadata:
  name: __CR_NAME__
spec:
  edition: community
  version: "2026.05.0"
  license:
    accept: "yes"
  topology:
    mode: Cluster
    primaries:
      members: 1
  # Present only so the edition is the single reason this CR is refused (TLS-011).
  trust:
    insecureAdminConnection: true
  storage:
    volumes:
      data:
        mode: Dynamic
        dynamic:
          size: __DATA_SIZE__
          storageClassName: __STORAGE_CLASS__
  auth:
    generatePassword: true
