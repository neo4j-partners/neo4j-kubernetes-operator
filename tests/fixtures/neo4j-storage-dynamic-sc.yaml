apiVersion: neo4j.com/v1beta1
kind: Neo4j
metadata:
  name: __CR_NAME__
spec:
  edition: enterprise
  version: "2026.05.0"
  license:
    accept: "yes"
  topology:
    mode: Standalone
  storage:
    volumes:
      data:
        mode: Dynamic
        dynamic:
          size: 1Gi
          # Resolved from the cloud profile — `standard` on kind (rancher.io/local-path),
          # `managed-csi` on AKS — because the subject of this case is naming an existing
          # class explicitly, which must hold on every platform.
          storageClassName: __CLOUD_STORAGE_CLASS__
  auth:
    generatePassword: true
