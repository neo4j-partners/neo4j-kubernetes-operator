# Neo4j workload base — neo4j.com/v1beta1 Standalone

apiVersion: neo4j.com/v1beta1
kind: Neo4j

defaults:
  namespace: default
  edition: enterprise
  # Deliberately not a number: the version a run tests is resolved, not fixed here. See
  # ../versions.sh for the pins and ../../contribute.md for how a run picks between them.
  version: "${NEO4J_VERSION}"
  license:
    accept: "yes"
  topology:
    mode: Standalone
  auth:
    generatePassword: true

fixture: tests/fixtures/neo4j-standalone.yaml

timeouts:
  assert: 300s
  assert_neo4j_ready: false
