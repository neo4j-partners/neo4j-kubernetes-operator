# Pipeline for namespace-scope tests. Installs the operator from the Helm chart: it is the only
# install path that can express more than one watched namespace, since the kustomize manifests
# hard-code WATCH_NAMESPACE=default and ship a single Role. The release gets its own namespace so
# it cannot collide with the kustomize install other suites apply on a shared cluster.
#
# Applies a CR to EVERY watched namespace (positive controls) and to an unwatched one (negative
# control), so a single case can prove the operator acts in each namespace of its scope and only
# there.
setup:
  - operator/install-helm

teardown:
  - cleanup/operator-helm

case_run:
  - scope/apply-watched
  - scope/apply-unwatched

case_teardown:
  - scope/cleanup-watched
  - scope/cleanup-unwatched
