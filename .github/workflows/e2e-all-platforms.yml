name: E2E — all platforms

# The same suites as CI, on kind and on a real AKS cluster in parallel. Azure
# lives here rather than in CI because it creates and destroys a cluster on
# every run, so it is scheduled daily instead of gating pull requests.
on:
  schedule:
    # 05:00 UTC — 07:00 in Paris on summer time, 06:00 on winter time.
    # GitHub cron has no timezone support, so the hour shifts with DST.
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  # Deliberately not keyed on the ref: every run of this workflow, whether from
  # cron on main or dispatched on a branch, competes for the same Azure resource
  # group, ACR and AKS names. Serialising them stops one run tearing down the
  # cluster another is testing against.
  group: e2e-all-platforms
  # Never cancel a run in progress: an interrupted Azure run must still reach
  # its teardown step rather than leave an AKS cluster billing.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  unit:
    uses: ./.github/workflows/unit.yml

  # Both targets declare the same single dependency and none on each other, so
  # they start together as soon as unit passes. Gating on unit avoids creating
  # an AKS cluster for code that does not compile.
  #
  # Neither fans a matrix out the way CI does: passing no `suite` runs them all in one job. For
  # azure that is mandatory, since parallel jobs would race to provision the shared AKS cluster
  # while another job's teardown deleted the resource group underneath them.
  e2e-local-kind:
    name: kind
    needs: unit
    runs-on: ubuntu-latest
    # Plugin licence material for feature-plugins. Unset on fork PRs, where secrets are not
    # exposed — the suite falls back to a dummy licence and skips the acceptance checks.
    env:
      LICENSE_GDS: ${{ secrets.LICENSE_GDS }}
      LICENSE_BLOOM: ${{ secrets.LICENSE_BLOOM }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/e2e
        with:
          cloud: local-kind

  e2e-azure-aks:
    name: Azure
    needs: unit
    runs-on: ubuntu-latest
    env:
      # Plugin licence material for feature-plugins; see the kind job above.
      LICENSE_GDS: ${{ secrets.LICENSE_GDS }}
      LICENSE_BLOOM: ${{ secrets.LICENSE_BLOOM }}
      # Azure resource names — override via repository Variables
      # (Settings > Secrets and variables > Actions > Variables).
      # Unset falls back to the defaults in tests/config/cloud/azure-aks.sh.
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_AKS_NAME: ${{ vars.AZURE_AKS_NAME }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      AZURE_AKS_NODE_COUNT: ${{ vars.AZURE_AKS_NODE_COUNT }}
      AZURE_AKS_NODE_VM_SIZE: ${{ vars.AZURE_AKS_NODE_VM_SIZE }}
      # ensure-aks.sh selects the subscription; only a workflow can read the secret.
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v5

      # Service principal with a client secret: azure/login ignores `creds`
      # as soon as client-id is passed as an input, so the credentials go in
      # as one JSON object.
      - name: Azure login
        uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_SERVICE_ACCOUNT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - uses: ./.github/actions/e2e
        with:
          cloud: azure-aks

      # Always tear down the platform (AKS + ACR + RG), even when a suite fails or the run is
      # cancelled — an orphaned AKS cluster bills by the hour. This stays a job step rather than
      # part of the action: inside a composite, `always()` tracks the action's status, not the
      # job's, so a cancelled job would skip it.
      - name: Teardown Azure resources
        if: always()
        run: |
          rg="${AZURE_RESOURCE_GROUP:-neo4j-operator-ci-rg}"
          if az group show --name "${rg}" >/dev/null 2>&1; then
            echo "Deleting resource group ${rg}"
            az group delete --name "${rg}" --yes --no-wait
          else
            echo "Resource group ${rg} not found — nothing to tear down"
          fi
