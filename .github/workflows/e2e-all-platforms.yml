name: E2E — all platforms

# Puts the platform and the versions on the Actions list page, so a run is identifiable without
# opening it. GitHub evaluates this before any job starts and reaches only the `github` and
# `inputs` contexts, so the fallbacks — what a scheduled run gets, since it fills in no form — are
# literal copies of tests/config/versions.sh. Move a default there and here in one change.
#
# With `all` selected there are four Kubernetes versions in play and no room to name them, hence
# "per platform"; each job records its own pair in its summary, see VERSIONS_JOB_SUMMARY below.
run-name: >-
  E2E — Platform ${{ inputs.platform || 'all' }},
  Kubernetes ${{ (inputs.platform == 'local-kind' && inputs.kind-kubernetes-version) || (inputs.platform == 'azure' && inputs.aks-kubernetes-version) || (inputs.platform == 'gcp' && inputs.gke-kubernetes-version) || (inputs.platform == 'aws' && inputs.eks-kubernetes-version) || 'per platform' }},
  Neo4j ${{ inputs.neo4j-version || '2026.07.1' }}

# The same suites as CI, on kind and on real AKS, GKE and EKS clusters in parallel.
# The managed clusters live here rather than in CI because each run creates and
# destroys one, so this is scheduled daily instead of gating pull requests.
on:
  schedule:
    # 05:00 UTC — 07:00 in Paris on summer time, 06:00 on winter time.
    # GitHub cron has no timezone support, so the hour shifts with DST.
    - cron: "0 5 * * *"
  # Every list holds concrete versions and every default is the newest of them. There is no
  # `latest` that resolves itself at run time: a nightly failure has to be reproducible on the
  # same version weeks later, and holding the list still is what makes the default both current
  # and reproducible — which is why there is no second `pinned` value either. Moving a version is
  # an edit to tests/config/versions.sh, reviewed like any other.
  #
  # One Kubernetes list per platform, because the four cannot be given the same number: kind pulls
  # a published kindest/node tag and needs the exact patch, AKS and GKE take a minor and choose the
  # patch themselves, and EKS rejects a patch outright. The ceiling common to all four is 1.36 —
  # only kind can run 1.37 today. GitHub cannot narrow a list to the platform picked in the same
  # form, so the three lists that do not apply are simply ignored.
  #
  # The option lists are hand-maintained copies of tests/config/versions.sh — GitHub requires
  # `type: choice` options to be literal YAML, so they cannot be generated from it.
  workflow_dispatch:
    inputs:
      platform:
        description: "Which platform to run"
        type: choice
        default: all
        options: [all, local-kind, azure, gcp, aws]
      kind-kubernetes-version:
        description: "Kubernetes for kind — exact patch, and only a tag kind publishes"
        type: choice
        default: "1.37.0"
        options: ["1.37.0", "1.36.4", "1.35.8"]
      aks-kubernetes-version:
        description: "Kubernetes for AKS — minor; Azure selects the patch"
        type: choice
        default: "1.36"
        options: ["1.36", "1.35"]
      gke-kubernetes-version:
        description: "Kubernetes for GKE — minor; Google selects the patch and its -gke build"
        type: choice
        default: "1.36"
        options: ["1.36", "1.35"]
      eks-kubernetes-version:
        description: "Kubernetes for EKS — minor only; 1.34 is the oldest in standard support"
        type: choice
        default: "1.36"
        options: ["1.36", "1.35", "1.34"]
      neo4j-version:
        description: "Neo4j version the suites deploy, on every platform"
        type: choice
        default: "2026.07.1"
        options: ["2026.07.1", "2026.06.0", "2026.05.0", "5.26.29"]

concurrency:
  # Deliberately not keyed on the ref: every run of this workflow, whether from
  # cron on main or dispatched on a branch, competes for the same fixed cloud
  # names — Azure resource group, ACR and AKS, GKE cluster and Artifact Registry,
  # EKS cluster and ECR repository. Serialising them stops one run tearing down
  # the cluster another is testing against.
  group: e2e-all-platforms
  # Never cancel a run in progress: an interrupted cloud run must still reach its
  # teardown step rather than leave a managed cluster billing.
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Have the version resolver state the versions it picked in the job summary, so the run page
  # carries the exact numbers that `latest` stood for on the day — the one thing the run name
  # above cannot say. Set for the whole workflow because every job here is a platform, making one
  # line per job informative; CI keeps it off, since fanning out per suite would repeat it
  # fourteen times.
  VERSIONS_JOB_SUMMARY: "true"

jobs:
  unit:
    uses: ./.github/workflows/unit.yml

  # The four targets declare the same single dependency and none on each other, so they start
  # together as soon as unit passes. Gating on unit avoids creating a managed cluster for code
  # that does not compile.
  #
  # None fans a matrix out the way CI does: passing no `suite` runs them all in one job. For the
  # cloud targets that is mandatory, since parallel jobs would race to provision the one shared
  # cluster while another job's teardown deleted it underneath them.
  e2e-local-kind:
    name: kind
    needs: unit
    # An empty platform is a scheduled run: it fills in no form, so it runs all four.
    if: inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'local-kind'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/e2e
        with:
          cloud: local-kind
          # Both empty on the scheduled run, where `inputs` carries nothing. The action then takes
          # this platform's default from tests/config/versions.sh rather than guessing here.
          kubernetes-version: ${{ inputs.kind-kubernetes-version }}
          neo4j-version: ${{ inputs.neo4j-version }}

  e2e-azure-aks:
    name: Azure
    needs: unit
    if: inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'azure'
    runs-on: ubuntu-latest
    env:
      # Azure resource names — override via repository Variables
      # (Settings > Secrets and variables > Actions > Variables).
      # Unset falls back to the defaults in tests/config/cloud/azure-aks.sh.
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_AKS_NAME: ${{ vars.AZURE_AKS_NAME }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      AZURE_AKS_NODE_COUNT: ${{ vars.AZURE_AKS_NODE_COUNT }}
      AZURE_AKS_NODE_VM_SIZE: ${{ vars.AZURE_AKS_NODE_VM_SIZE }}
      # ensure-aks.sh selects the subscription; only a workflow can read the secret.
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v5

      # Service principal with a client secret: azure/login ignores `creds`
      # as soon as client-id is passed as an input, so the credentials go in
      # as one JSON object.
      - name: Azure login
        uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_SERVICE_ACCOUNT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - uses: ./.github/actions/e2e
        with:
          cloud: azure-aks
          # A minor: ensure-aks.sh passes it to `az aks create` and Azure selects the patch. The
          # nightly destroys the cluster at the end of the run, so this is honoured on every run
          # rather than being frozen by whatever the first cluster was created with.
          kubernetes-version: ${{ inputs.aks-kubernetes-version }}
          neo4j-version: ${{ inputs.neo4j-version }}

      # Always tear down the platform (AKS + ACR + RG), even when a suite fails or the run is
      # cancelled — an orphaned AKS cluster bills by the hour. This stays a job step rather than
      # part of the action: inside a composite, `always()` tracks the action's status, not the
      # job's, so a cancelled job would skip it.
      - name: Teardown Azure resources
        if: always()
        run: |
          rg="${AZURE_RESOURCE_GROUP:-neo4j-operator-ci-rg}"
          if az group show --name "${rg}" >/dev/null 2>&1; then
            echo "Deleting resource group ${rg}"
            az group delete --name "${rg}" --yes --no-wait
          else
            echo "Resource group ${rg} not found — nothing to tear down"
          fi

  e2e-gcp-gke:
    name: GCP
    needs: unit
    if: inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'gcp'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Workload identity federation exchanges this job's OIDC token for a short-lived GCP
      # credential. Without id-token the exchange has nothing to present and auth fails before
      # any cluster exists. Declared per job so the other targets keep the read-only default.
      id-token: write
    env:
      # GCP names and sizing — override via repository Variables
      # (Settings > Secrets and variables > Actions > Variables).
      # Unset falls back to the defaults in tests/config/cloud/gcp-gke.sh.
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ZONE: ${{ vars.GCP_ZONE }}
      GCP_AR_REPOSITORY: ${{ vars.GCP_AR_REPOSITORY }}
      GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
      GKE_NODE_COUNT: ${{ vars.GKE_NODE_COUNT }}
      GKE_MACHINE_TYPE: ${{ vars.GKE_MACHINE_TYPE }}
    steps:
      - uses: actions/checkout@v5

      # Keyless: the provider trusts this repository's OIDC token and impersonates the service
      # account, so no service account key is stored anywhere. Both values are configuration, not
      # secrets — a Variable overrides them without touching this file.
      - name: GCP auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/1024447859763/locations/global/workloadIdentityPools/github-pool/providers/github-provider' }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT || 'gh-actions-k8s-operator-test@kop12345.iam.gserviceaccount.com' }}

      # gcloud ships on the runner image; the plugin kubectl needs to authenticate against GKE
      # does not, and get-credentials would write a kubeconfig no later kubectl call can use.
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - uses: ./.github/actions/e2e
        with:
          cloud: gcp-gke
          # A minor: ensure-gke.sh passes it to `gcloud container clusters create` and Google
          # selects both the patch and its -gke build number.
          kubernetes-version: ${{ inputs.gke-kubernetes-version }}
          neo4j-version: ${{ inputs.neo4j-version }}

      # Same reasoning as Azure: a GKE cluster bills by the hour, and `always()` inside the
      # composite would track the action rather than the job. Only the cluster goes — the
      # Artifact Registry repository is kept on purpose, it costs cents and saves a full push.
      - name: Teardown GKE cluster
        if: always()
        run: |
          cluster="${GKE_CLUSTER_NAME:-neo4j-operator-ci-gke}"
          zone="${GCP_ZONE:-europe-west1-b}"
          if gcloud container clusters describe "${cluster}" --zone "${zone}" >/dev/null 2>&1; then
            echo "Deleting GKE cluster ${cluster} in ${zone}"
            gcloud container clusters delete "${cluster}" --zone "${zone}" --quiet --async
          else
            echo "GKE cluster ${cluster} not found — nothing to tear down"
          fi

  e2e-aws-eks:
    name: AWS
    needs: unit
    if: inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'aws'
    runs-on: ubuntu-latest
    env:
      # AWS names and sizing — override via repository Variables
      # (Settings > Secrets and variables > Actions > Variables).
      # Unset falls back to the defaults in tests/config/cloud/aws-eks.sh.
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
      AWS_EKS_NAME: ${{ vars.AWS_EKS_NAME }}
      AWS_EKS_NODE_COUNT: ${{ vars.AWS_EKS_NODE_COUNT }}
      AWS_EKS_NODE_INSTANCE_TYPE: ${{ vars.AWS_EKS_NODE_INSTANCE_TYPE }}
      # Empty means "discover the default VPC", which is what CI relies on.
      AWS_EKS_SUBNET_IDS: ${{ vars.AWS_EKS_SUBNET_IDS }}
      # The two IAM roles EKS requires. The CI identity holds PowerUserAccess and cannot create
      # them, so they are provisioned out of band — see tests/contribute.md (AWS CI setup).
      AWS_EKS_CLUSTER_ROLE: ${{ vars.AWS_EKS_CLUSTER_ROLE }}
      AWS_EKS_NODE_ROLE: ${{ vars.AWS_EKS_NODE_ROLE }}
    steps:
      - uses: actions/checkout@v5

      # Long-lived access key rather than OIDC, unlike GCP: an organisation policy on this account
      # reserves role assumption for SSO principals, so a workload identity gets a key. The secrets
      # stay in this step's inputs — the action exports only the resolved credentials to the rest of
      # the job, so they never appear in a job-level env block.
      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # Required input, so it cannot rely on the profile default the way the names above do.
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}

      - uses: ./.github/actions/e2e
        with:
          cloud: aws-eks
          # A minor, and EKS takes nothing else — ensure-eks.sh truncates a longer value before
          # calling create-cluster, since the API rejects a patch rather than rounding it down.
          kubernetes-version: ${{ inputs.eks-kubernetes-version }}
          neo4j-version: ${{ inputs.neo4j-version }}

      # Same reasoning as the other two clouds, with one addition: EKS refuses to delete a cluster
      # that still owns a nodegroup, so the order and the bounded wait live in a script rather than
      # inline here. The ECR repository is kept on purpose.
      - name: Teardown EKS cluster
        if: always()
        run: bash tests/aws/teardown-eks.sh
