name: Release

# Cut a public release from a semver tag (e.g. v1.0.0):
#   - operator image  -> ghcr.io/<owner>/neo4j-kubernetes-operator:<version>
#                        (manifest index: linux/amd64 + linux/arm64)
#   - Helm chart (OCI) -> oci://ghcr.io/<owner>/charts/neo4j-operator:<version>
#   - GitHub Release   -> the 1.5 MB CRD as a downloadable asset (server-side apply)
#
# The CRD is deliberately NOT bundled in the chart: at ~1.5 MB it flirts with the
# etcd object limit, and Helm never upgrades crds/ on `helm upgrade`. Shipping it
# as a release asset keeps a stable URL for `kubectl apply --server-side`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to cut (e.g. v1.0.0)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub Release + upload the CRD asset
  packages: write # push image + chart to GHCR
  id-token: write # keyless cosign signing via Sigstore/GitHub OIDC (NEO-009)

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CHART_OCI: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 + tags so the notes step can walk the full history between tags;
      # the default shallow checkout has no previous tag to diff against.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      # One source of truth for the release identifiers: `tag` keeps the leading v
      # (GitHub Release + git tag), `version` drops it (semver for image + chart).
      - name: Resolve version
        id: v
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"
          echo "Releasing ${tag}"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Build & push operator image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # One tag, one manifest index, two architectures — each node's runtime selects its own,
          # so a mixed-architecture cluster needs no second tag and no `--set image.*`. Both are
          # built and pushed in this single step, so the tag never exists as amd64-only.
          #
          # The Dockerfile cross-compiles from the native builder, so this costs a second `go
          # build` rather than an emulated image build: no setup-qemu-action is needed.
          platforms: linux/amd64,linux/arm64
          # Attestations add manifests to the index that some registries and admission tools still
          # mis-read. The index itself is now unavoidable — it is what carries the two
          # architectures — but keeping provenance off holds it to the two entries and nothing else.
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.v.outputs.version }}

      # Everything below binds to the immutable build digest, never the mutable tag, so the artifact
      # a customer verifies is exactly the one this run pushed (NEO-009: CWE-1357/CWE-494).
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      # Keyless signature + SPDX SBOM attestation, both on <image>@<digest>. cosign stores these as
      # separate .sig/.att tags, not index entries, so the two-arch index stays clean (provenance:false).
      - name: Sign image and attest SBOM (by digest)
        env:
          IMAGE_DIGEST: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          SBOM_FILE: sbom-${{ steps.v.outputs.version }}.spdx.json
          COSIGN_YES: "true"
        run: |
          cosign sign "${IMAGE_DIGEST}"
          syft "${IMAGE_DIGEST}" -o spdx-json > "${SBOM_FILE}"
          cosign attest --predicate "${SBOM_FILE}" --type spdxjson "${IMAGE_DIGEST}"
          # Record the immutable reference so consumers can pin image.digest in the chart.
          echo "${IMAGE_DIGEST}" > "image-digest-${{ steps.v.outputs.version }}.txt"

      # helm push authenticates against its own registry config, not docker login.
      - name: Package & push Helm chart (OCI)
        run: |
          helm registry login "${REGISTRY}" -u "${{ github.actor }}" -p "${{ secrets.GH_TOKEN }}"
          helm package charts/neo4j-operator \
            --version "${{ steps.v.outputs.version }}" \
            --app-version "${{ steps.v.outputs.version }}"
          helm push "neo4j-operator-${{ steps.v.outputs.version }}.tgz" "${CHART_OCI}"

      # Notes come from conventional-commit subjects between the previous tag and this one, so the
      # release lists the features/fixes added rather than a single commit. We commit straight to
      # main (no PRs), so GitHub's PR-based --generate-notes would be empty; the git log is the source.
      - name: Build release notes from commits
        run: |
          prev="$(git describe --tags --abbrev=0 "${{ steps.v.outputs.tag }}^" 2>/dev/null || true)"
          range="${prev:+${prev}..}${{ steps.v.outputs.tag }}"
          feats="$(git log --no-merges --pretty='- %s' ${range} | grep -E '^- feat' | sed -E 's/^- feat(\([^)]*\))?!?: /- /' || true)"
          fixes="$(git log --no-merges --pretty='- %s' ${range} | grep -E '^- fix'  | sed -E 's/^- fix(\([^)]*\))?!?: /- /'  || true)"
          {
            echo "## ${{ steps.v.outputs.tag }}"
            echo
            echo "### Features"
            echo "${feats:-- _none_}"
            echo
            echo "### Fixes"
            echo "${fixes:-- _none_}"
            [ -n "${prev}" ] && { echo; echo "**Full changelog**: https://github.com/${{ github.repository }}/compare/${prev}...${{ steps.v.outputs.tag }}"; }
          } > release-notes.md
          cat release-notes.md

      # `gh release create` uses the pushed tag, or creates it at HEAD on manual dispatch.
      - name: Publish GitHub Release with CRD asset
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # Bundle every CRD (Neo4j + backup/restore/schedule), not just neo4js, or a release
          # install leaves those controllers without their CRDs. kustomize tracks config/crd/bases.
          kubectl kustomize config/crd/bases > "neo4j-crd-${{ steps.v.outputs.version }}.yaml"
          gh release create "${{ steps.v.outputs.tag }}" \
            "neo4j-crd-${{ steps.v.outputs.version }}.yaml" \
            "sbom-${{ steps.v.outputs.version }}.spdx.json" \
            "image-digest-${{ steps.v.outputs.version }}.txt" \
            --title "${{ steps.v.outputs.tag }}" \
            --notes-file release-notes.md
