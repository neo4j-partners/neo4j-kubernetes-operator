name: Azure cleanup

# Safety net for the azure-aks e2e target. The run's own teardown step is enough for a
# normal cancellation — the server re-evaluates `if` on cancel and `always()` still runs —
# but a force-cancel bypasses `always()` by design, and a lost runner skips every step.
# Either way an AKS cluster keeps billing by the hour, so this workflow deletes the CI
# resource group (AKS + ACR) out of band. It is a no-op when the group is already gone.
#
# schedule and workflow_dispatch only register from the default branch, so this file must
# be on main before it can be scheduled or triggered from the Actions tab.
on:
  schedule:
    # 09:00 UTC — four hours after e2e-all-platforms starts, by which point it has finished.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Delete even while an E2E run is in flight — for a run stuck in progress"
        type: boolean
        default: false

permissions:
  contents: read
  # gh run list, to tell a live run from an abandoned resource group.
  actions: read

concurrency:
  group: azure-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete leftover Azure resources
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Same fallback as tests/config/cloud/azure-aks.sh, so both agree on the target.
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'neo4j-operator-ci-rg' }}
    steps:
      # A running suite owns the cluster: deleting it underneath would fail that run for
      # no reason. Only e2e-all-platforms touches Azure — ci.yml is kind-only.
      - name: Skip while an E2E run holds the cluster
        if: ${{ !inputs.force }}
        run: |
          active=0
          for status in in_progress queued; do
            n="$(gh run list --workflow e2e-all-platforms.yml --status "${status}" --json databaseId --jq 'length')"
            active=$((active + n))
          done
          if (( active > 0 )); then
            echo "::notice::${active} E2E run(s) in flight — leaving ${AZURE_RESOURCE_GROUP} alone"
            echo "skip=true" >>"${GITHUB_ENV}"
          fi

      - name: Azure login
        if: env.skip != 'true'
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_SERVICE_ACCOUNT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Delete the CI resource group
        if: env.skip != 'true'
        run: |
          if az group show --name "${AZURE_RESOURCE_GROUP}" >/dev/null 2>&1; then
            echo "Deleting resource group ${AZURE_RESOURCE_GROUP}"
            az group delete --name "${AZURE_RESOURCE_GROUP}" --yes --no-wait
          else
            echo "Resource group ${AZURE_RESOURCE_GROUP} not found — nothing to clean up"
          fi
