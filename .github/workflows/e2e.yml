name: E2E

# Reusable: runs e2e against one cloud target, either one named suite or all of them.
#
# ci.yml passes `suite` and fans out a matrix, so each suite is its own job with its own
# log, its own re-run button and its own results artifact.
#
# e2e-all-platforms.yml passes no `suite`, so every suite runs in a single job. That is
# required for azure-aks: the jobs share one AKS cluster, and parallel jobs would race to
# provision it while another job's teardown deleted the resource group underneath them.
#
# Callers must pass the AZURE_* secrets for the azure-aks target.
on:
  workflow_call:
    inputs:
      cloud:
        description: "Target platform — local-kind or azure-aks"
        required: true
        type: string
      suite:
        description: "Single suite to run. Empty runs every suite in one job (the azure path)."
        required: false
        default: ""
        type: string
      images_artifact:
        description: "Artifact holding pre-built operator + Neo4j images. Empty builds and pulls in-job."
        required: false
        default: ""
        type: string
    # Declared rather than inherited, so this workflow states exactly what it
    # needs. Unset for the local-kind target, which touches no cloud.
    secrets:
      AZURE_CLIENT_ID:
        required: false
      AZURE_SERVICE_ACCOUNT_SECRET:
        required: false
      AZURE_SUBSCRIPTION_ID:
        required: false
      AZURE_TENANT_ID:
        required: false

permissions:
  contents: read

jobs:
  # The UI shows "<caller job> / <this job>", so this half names the platform only — the caller
  # already names what is being run (the suite under ci.yml). Repeating the suite here is what
  # produced "E2E (feature-config) / feature-config", long enough to be elided in the checks list.
  e2e:
    name: ${{ inputs.cloud }}
    runs-on: ubuntu-latest
    env:
      CLOUD: ${{ inputs.cloud }}
      # Azure resource names — override via repository Variables
      # (Settings > Secrets and variables > Actions > Variables).
      # Unset falls back to the defaults in tests/config/cloud/azure-aks.sh.
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_AKS_NAME: ${{ vars.AZURE_AKS_NAME }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      AZURE_AKS_NODE_COUNT: ${{ vars.AZURE_AKS_NODE_COUNT }}
      AZURE_AKS_NODE_VM_SIZE: ${{ vars.AZURE_AKS_NODE_VM_SIZE }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"

      - uses: docker/setup-buildx-action@v4

      - name: Prepare scripts
        run: find tests -name '*.sh' -exec chmod +x {} +

      # ---------------------------------------------------------------- kind
      - name: Install kind
        if: inputs.cloud == 'local-kind'
        uses: helm/kind-action@v1
        with:
          install_only: true

      # One operator build and one Docker Hub pull per RUN, not per suite. Without this the
      # matrix would rebuild the operator and re-pull Neo4j for every suite; the pull is
      # rate-limited on CI runners, which is the very thing setup-local-kind.sh pre-loads
      # to avoid.
      - name: Restore shared images
        if: inputs.cloud == 'local-kind' && inputs.images_artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.images_artifact }}
          path: /tmp/e2e-images

      - name: Load shared images into the daemon
        if: inputs.cloud == 'local-kind' && inputs.images_artifact != ''
        run: |
          for tar in /tmp/e2e-images/*.tar; do
            echo "loading ${tar}"
            docker load -i "${tar}"
          done
          echo "E2E_REUSE_LOCAL_IMAGES=true" >> "${GITHUB_ENV}"

      - name: Create kind cluster and load operator image
        if: inputs.cloud == 'local-kind'
        run: bash tests/bin/setup-local-kind.sh

      # --------------------------------------------------------------- azure
      # Service principal with a client secret: azure/login ignores `creds`
      # as soon as client-id is passed as an input, so the credentials go in
      # as one JSON object.
      - name: Azure login
        if: inputs.cloud == 'azure-aks'
        uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_SERVICE_ACCOUNT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Ensure AKS cluster and ACR
        if: inputs.cloud == 'azure-aks'
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          # Creates the resource group, ACR and AKS cluster if missing, then wires kubectl.
          . tests/azure/ensure-aks.sh
          echo "OPERATOR_IMAGE=${OPERATOR_IMAGE}" >> "${GITHUB_ENV}"
          echo "AZURE_ACR_NAME=${AZURE_ACR_NAME}" >> "${GITHUB_ENV}"
          # Persist the resolved resource group (script default applies when the Variable is unset) for teardown.
          echo "AZURE_RESOURCE_GROUP=${AZURE_RESOURCE_GROUP}" >> "${GITHUB_ENV}"

      - name: Push operator image to ACR
        if: inputs.cloud == 'azure-aks'
        run: bash tests/azure/push-operator-image.sh

      # --------------------------------------------------------------- suites
      # Two modes. `suite` set: this job runs exactly one suite, and the caller fans the
      # matrix out — each suite gets its own job, its own log and its own re-run button.
      # `suite` empty: every suite runs in this one job, which is what the azure target
      # needs because all its jobs would otherwise race to provision and tear down the
      # same AKS cluster.
      #
      # Neither mode hardcodes the list: it comes from tests/suites/*.yaml, so adding a
      # suite file is all it takes to get it into CI.
      - name: "Suite: ${{ inputs.suite }}"
        if: inputs.suite != ''
        run: ./tests/bin/run-e2e.sh "${{ inputs.suite }}"

      - name: All suites
        if: inputs.suite == ''
        run: |
          set -uo pipefail
          fail=0
          for f in tests/suites/*.yaml; do
            s="$(basename "${f}" .yaml)"
            echo "::group::${s}"
            # Keep going so every suite reports, then fail the step if any did.
            ./tests/bin/run-e2e.sh "${s}" || fail=1
            echo "::endgroup::"
          done
          exit "${fail}"

      - name: Upload e2e results (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-${{ inputs.cloud }}-${{ inputs.suite || 'all' }}-${{ github.run_id }}
          path: tests/results/
          if-no-files-found: warn
          retention-days: 14

      # Always tear down the Azure platform (AKS + ACR + RG), even when a suite fails
      # or the run is cancelled — an orphaned AKS cluster bills by the hour.
      - name: Teardown Azure resources
        if: always() && inputs.cloud == 'azure-aks'
        run: |
          rg="${AZURE_RESOURCE_GROUP:-neo4j-operator-ci-rg}"
          if az group show --name "${rg}" >/dev/null 2>&1; then
            echo "Deleting resource group ${rg}"
            az group delete --name "${rg}" --yes --no-wait
          else
            echo "Resource group ${rg} not found — nothing to tear down"
          fi
