name: CI

# Gate for every change: unit tests and audit, then the full e2e suite on kind.
# Azure is deliberately excluded — it is slow and costs money, so it runs in
# the nightly workflow instead.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    uses: ./.github/workflows/unit.yml

  e2e-local-kind:
    name: E2E
    needs: unit
    uses: ./.github/workflows/e2e.yml
    with:
      cloud: local-kind
