name: CI

# Gate for every change: unit tests and audit, then every e2e suite on kind, one job each.
# Azure is deliberately excluded — it is slow and costs money, so it runs in
# the nightly workflow instead.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A push or a pull request always runs the pinned pair, so a red check means the change under
  # review broke something rather than an upstream release having landed overnight. The nightly
  # e2e-all-platforms run is what tracks the newest versions; these dropdowns are for reproducing
  # one of its failures here, or for trying a version before promoting it.
  #
  # The option lists are hand-maintained copies of tests/config/versions.sh — GitHub requires
  # `type: choice` options to be literal YAML, so they cannot be generated from it.
  workflow_dispatch:
    inputs:
      kubernetes-version:
        description: "Kubernetes version for the kind clusters"
        type: choice
        default: pinned
        options: [pinned, latest, "1.37.0", "1.36.4", "1.35.0"]
      neo4j-version:
        description: "Neo4j version the suites deploy"
        type: choice
        default: pinned
        options: [pinned, latest, "2026.07.1", "2026.06.0", "2026.05.0", "5.26.29"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    uses: ./.github/workflows/unit.yml

  # Build the operator and fetch Neo4j ONCE per run, then hand both to every suite job.
  # Serially this cost 138s and was paid once; fanned out it would be paid by all ten jobs,
  # including ten Docker Hub pulls of the Neo4j image — rate-limited on CI runners, and the
  # very thing setup-local-kind.sh pre-loads to avoid.
  images:
    name: Build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      # The suite jobs resolve this for themselves; this job has to as well, because it is the one
      # that decides which tag to pull and cache. Both go through the same script, so the image
      # shared across the matrix cannot be a different version from the one the fixtures deploy.
      - name: Resolve the versions under test
        env:
          NEO4J_VERSION_SELECTOR: ${{ inputs.neo4j-version || 'pinned' }}
        run: bash tests/bin/resolve-versions.sh

      - name: Resolve the Neo4j image
        id: neo4j
        run: |
          # base.sh yields to the NEO4J_VERSION the step above exported, and falls back to the pin
          # in tests/config/versions.sh — the same path setup-local-kind.sh takes.
          . tests/config/neo4j/base.sh
          if [ "${NEO4J_EDITION}" = "enterprise" ]; then
            image="neo4j:${NEO4J_VERSION}-enterprise"
          else
            image="neo4j:${NEO4J_VERSION}"
          fi
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "Neo4j image: ${image}"

      # Keyed on the pinned tag, so it survives across runs and only re-pulls when the
      # version moves.
      - name: Cache the Neo4j image
        id: neo4j-cache
        uses: actions/cache@v6
        with:
          path: /tmp/e2e-images/neo4j.tar
          key: neo4j-image-${{ steps.neo4j.outputs.image }}

      - name: Pull Neo4j
        if: steps.neo4j-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/e2e-images
          docker pull "${{ steps.neo4j.outputs.image }}"
          docker save -o /tmp/e2e-images/neo4j.tar "${{ steps.neo4j.outputs.image }}"

      # Never cached: it is this commit's code.
      - name: Build the operator
        run: |
          mkdir -p /tmp/e2e-images
          docker build -t neo4j-operator:local .
          docker save -o /tmp/e2e-images/operator.tar neo4j-operator:local

      - name: Share both images
        uses: actions/upload-artifact@v7
        with:
          name: e2e-images
          path: /tmp/e2e-images/*.tar
          retention-days: 1

  # The matrix comes from the suite files themselves, so adding tests/suites/<name>.yaml is
  # all it takes to get a CI job. The previous workflow listed every suite by hand, which
  # meant a new suite silently ran nowhere until someone remembered to edit it.
  suites:
    name: Discover suites
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.find.outputs.list }}
    steps:
      - uses: actions/checkout@v5
      - id: find
        run: |
          list="$(ls tests/suites/*.yaml | xargs -n1 basename | sed 's/\.yaml$//' \
                  | jq -R . | jq -sc .)"
          echo "list=${list}" >> "${GITHUB_OUTPUT}"
          echo "Suites: ${list}"

  e2e-local-kind:
    # Named after the suite and nothing else, so the check reads "CI / feature-config". Calling a
    # reusable workflow instead would add a job level ("… / local-kind") and the checks list
    # truncates the left half, hiding the only part that identifies the leg.
    name: ${{ matrix.suite }}
    needs: [unit, images, suites]
    runs-on: ubuntu-latest
    strategy:
      # Every suite reports independently; one red suite must not hide the rest.
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.suites.outputs.list) }}
    steps:
      # A local action needs the repository on disk before it can be resolved.
      - uses: actions/checkout@v5
      - uses: ./.github/actions/e2e
        with:
          cloud: local-kind
          suite: ${{ matrix.suite }}
          images-artifact: e2e-images
          # Empty on push and pull_request, where `inputs` carries nothing — the fallback is what
          # makes those runs the reproducible ones.
          kubernetes-version: ${{ inputs.kubernetes-version || 'pinned' }}
          neo4j-version: ${{ inputs.neo4j-version || 'pinned' }}
