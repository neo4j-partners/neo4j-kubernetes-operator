# Purpose: security contexts, operand ServiceAccount annotations, and opt-in NetworkPolicy
#   for Neo4j pods.
# Apply: kubectl apply -f examples/standalone/22-security.yaml
# Related README: ../README.md#standalone
apiVersion: neo4j.com/v1
kind: Neo4j
metadata:
  name: dev-security
spec:
  edition: enterprise
  version: "2026.05.0"
  license:
    accept: "yes"
  topology:
    mode: Standalone
  security:
    # Omit pod/container securityContext for the operator default: uid/gid/fsGroup 7474 on
    # Kubernetes. On OpenShift (platform auto) those fields stay unset and restricted-v2
    # assigns the UID. drop ALL still applies in both cases.
    serviceAccount:
      # Plain SA annotations are for non-IAM metadata only. Cloud workload-identity annotations
      # (azure.workload.identity/client-id, eks.amazonaws.com/role-arn, iam.gke.io/gcp-service-account)
      # are still rejected *here* by NEO-002 — declare them under security.cloudIdentity.workloadIdentity
      # instead (see standalone/25-cloud-identity.yaml), which is the explicit, audited opt-in.
      annotations:
        example.com/owner: platform-team
    networkPolicy:
      enabled: true
      # Required when enabled (NEO-010) — never an empty From on client ports.
      # Empty podSelector = any pod in this namespace (tighten MatchLabels for apps).
      ingressFrom:
        - podSelector: {}
      # Optional: narrower peers for backup / metrics listeners.
      # backupFrom:
      #   - podSelector:
      #       matchLabels:
      #         app: neo4j-backup
      # metricsFrom:
      #   - namespaceSelector:
      #       matchLabels:
      #         kubernetes.io/metadata.name: monitoring
  storage:
    volumes:
      data:
        mode: Dynamic
        dynamic:
          size: 10Gi
  auth:
    generatePassword: true
