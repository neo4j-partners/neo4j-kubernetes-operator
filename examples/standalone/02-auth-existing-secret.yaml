# Purpose: Use a pre-created auth Secret instead of an operator-generated password.
# Prerequisites: create Secret "neo4j-auth" (mountable + allowed-for this CR name).
# Apply:
#   ./examples/secrets/create-auth-secret.sh default dev-auth-secret neo4j-auth
#   kubectl apply -f examples/standalone/02-auth-existing-secret.yaml
# Related README: ../README.md#standalone · ../secrets/README.md#byo-auth-secret-delegation-add-01
# Why the labels are required at all: docs/user-guide/03-neo4j/05-security.md
apiVersion: neo4j.com/v1beta1
kind: Neo4j
metadata:
  name: dev-auth-secret
spec:
  edition: enterprise
  version: "2026.05.0"
  license:
    accept: "yes"
  topology:
    mode: Standalone
  storage:
    volumes:
      data:
        mode: Dynamic
        dynamic:
          size: 10Gi
  auth:
    passwordSecretRef:
      name: neo4j-auth
