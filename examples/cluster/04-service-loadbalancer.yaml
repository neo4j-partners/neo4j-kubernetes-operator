# Purpose: 3-primary Cluster with a LoadBalancer client Service exposing bolt + http.
# Prerequisites: a cluster/cloud provider that provisions LoadBalancer Services.
# Apply: kubectl apply -f examples/cluster/04-service-loadbalancer.yaml
# Related README: ../README.md#cluster
apiVersion: neo4j.com/v1beta1
kind: Neo4j
metadata:
  name: prod-lb
spec:
  edition: enterprise
  version: "2026.05.0"
  license:
    accept: "yes"
  topology:
    mode: Cluster
    primaries:
      members: 3
  storage:
    volumes:
      data:
        mode: Dynamic
        dynamic:
          size: 10Gi
  connectivity:
    listeners:
      bolt: 7687
      http: 7474
    service:
      type: LoadBalancer
      # Required when type is LoadBalancer (ADD-08) — replace with your allowlist CIDRs.
      loadBalancerSourceRanges: ["10.0.0.0/8"]
      expose: [bolt, http]
  auth:
    generatePassword: true
  trust:
    # Cluster admission requires an admin Bolt path for the operator (NEO-004): this plaintext
    # opt-in (Warning event), or trust.certificates.bolt for verified TLS. Standalone needs neither.
    enabled: false
    insecureAdminConnection: true
