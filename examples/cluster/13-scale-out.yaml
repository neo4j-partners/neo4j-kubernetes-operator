# Purpose: Scale a cluster by editing topology.primaries.members (here: 5).
#   That field is the only one to touch: the system bootstrap gate is derived by the operator
#   and stays put, so scaling never rewrites neo4j.conf nor rolls the pool.
#
# The operator automates Neo4j membership (NEO-3-011-SRV-01 / BDR-009):
#   Scale-out — STS grows, then ENABLE SERVER (PRIMARY) for each new Free member.
#   Scale-in  — ALTER DATABASE SET TOPOLOGY down to fit remaining members, then
#               DEALLOCATE → DROP for tail ordinals, wipe Dynamic PVCs for those
#               ordinals when storage.volumeClaimRetention.whenScaled=Delete (NEO-007;
#               default Retain keeps PVCs — Dropped UUIDs cannot rejoin without a wipe),
#               then STS shrinks (gated by status.drainOK — operator-owned; do not set
#               neo4j.com/drain-ok on the CR).
#
# Storage caveat (scale-in then scale-out of the same ordinal):
#   Dynamic + whenScaled:Delete — operator wipes drained ordinal PVCs so the next join
#   gets a new UUID.
#   Dynamic + whenScaled:Retain (default) — PVCs kept on scale-in (NEO-007); on scale-out
#   the operator recycles a remounted Dropped Dynamic store (pod+PVC) so ENABLE can succeed.
#   Existing (claimName / pre-bound claims) — operator never deletes those volumes;
#   remounting the old store keeps the Dropped UUID and ENABLE SERVER fails until you
#   wipe/replace the claim data (or use a fresh claim). Prefer Dynamic for elastic pools.
#   Full note: docs/user-guide/03-neo4j/02-clustering.md#volumes-when-an-ordinal-comes-back
#
# Watch: kubectl get neo4j prod-scale -o jsonpath='{range .status.conditions[*]}{.type}={.status} ({.reason}){"\n"}{end}'
#   ClusterFormed=True when desired members are Enabled; ServersPendingDrain while draining.
#
# Prerequisites: none (or apply after examples/cluster/01-minimal-3-primaries.yaml; note
#   different metadata.name). Enterprise image + license accept required.
# Apply: kubectl apply -f examples/cluster/13-scale-out.yaml
apiVersion: neo4j.com/v1beta1
kind: Neo4j
metadata:
  name: prod-scale
spec:
  edition: enterprise
  version: "2026.05.0"
  license:
    accept: "yes"
  topology:
    mode: Cluster
    primaries:
      members: 5
  storage:
    volumeClaimRetention:
      whenScaled: Delete # required for elastic scale-in then scale-out (NEO-007)
    volumes:
      data:
        mode: Dynamic
        dynamic:
          size: 10Gi
  auth:
    generatePassword: true
  trust:
    # NEO-004: explicit opt-in to plaintext operator admin Bolt (Warning event).
    # Prefer trust.certificates.bolt for verified TLS instead.
    enabled: false
    insecureAdminConnection: true
