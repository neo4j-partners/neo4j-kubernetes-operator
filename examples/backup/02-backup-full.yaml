# Purpose: a one-shot Full backup of the neo4j database into the PVC destination (neo4j-backups).
#   A Full anchors a new backup chain. Watch it: kubectl get neo4jbackup bk-full -w
# Prerequisites: examples/backup/01-neo4j-pvc-destination.yaml applied and Ready.
# Apply: kubectl apply -f examples/backup/02-backup-full.yaml
apiVersion: neo4j.com/v1
kind: Neo4jBackup
metadata:
  name: bk-full
spec:
  neo4jRef:
    name: backup-demo
  databases: ["neo4j"]
  type: Full
  # For a large database, give --temp-path its own disk so staging doesn't overflow node
  # ephemeral storage (omit for a node-backed emptyDir, as below — fine for small/demo DBs):
  # scratch:
  #   size: 200Gi                  # ephemeral PVC, auto-deleted when the backup pod is (on success)
  #   # storageClassName: fast-ssd # optional; omit for the cluster default
  destination:
    type: pvc
    pvc:
      claimName: neo4j-backups
